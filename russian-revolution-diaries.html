function doneCh(ci){return chapters[ci].questions.every((q,qi)=>correct(q,getAns(ci,qi)))}
function readStep(ci){const v=state.read&&state.read[ci];return typeof v==='number'?v:0}
function chapterView(ci){const c=chapters[ci];const success=doneCh(ci);const n=c.diary.length;const st=success?n+2:readStep(ci);
 const names=c.who.map(id=>people[id].name.split(' ')[0]+'('+people[id].role+')').join(' · ');
 const journal=st===0?`<div class="cover reveal-new"><div class="covertitle">${esc(names)}의 일기장</div><div class="coverdate">${esc(c.date)}</div><button class="primary" data-read="${ci}">일기장 펼치기 ▸</button></div>`:`<section class="journal">${c.diary.slice(0,Math.min(st,n)).map((t,i)=>`<div class="${i===Math.min(st,n)-1&&st<=n?'reveal-new':''}">${diaryPara(t)}</div>`).join('')}${st<n?`<div class="readmore"><button class="secondary" data-read="${ci}">다음 장 넘기기 ▸</button><span class="pagecount">${st} / ${n}쪽</span></div>`:`<div class="signature">— 일기 끝 —</div>`}</section>`;
 const archive=st>=n+1?`<div class="${st===n+1?'reveal-new':''}"><div class="steptitle">역사 자료로 확인하기</div><div class="photo-grid">${c.imgs.map(imageBlock).join('')}</div><div class="clue"><b>역사 자료 해설</b><br>${mk(c.clue)}</div>${gloss(c)}${c.flow?flowSummary():''}</div>`:'';
 const gate=st===n?`<div class="nextstep"><p>일기를 다 읽었어요. 이 일기가 실제 역사와 어떻게 이어지는지 자료로 확인해 볼까요?</p><button class="primary" data-read="${ci}">역사 자료 살펴보기 ▸</button></div>`:st===n+1?`<div class="nextstep"><p>자료까지 확인했다면 미션에 도전하세요.</p><button class="primary" data-read="${ci}">미션 시작하기 ▸</button></div>`:'';
 const missions=st>=n+2?`<section class="missionbox ${st===n+2&&!success?'reveal-new':''}"><div class="missionhead"><h3>기록을 해독하라</h3><span>${c.questions.length}개 미션</span></div><div class="missioncontent">${c.questions.map((q,qi)=>mission(q,ci,qi)).join('')}${success?`<div class="successnotice"><b>✓ ${ci+1}장의 기록 복원 완료</b><br>이제 다음 시대의 일기를 읽을 수 있습니다.</div>`:`<p class="mark">모든 미션을 정확히 해결하면 다음 장이 열립니다. 오답은 몇 번이든 다시 시도할 수 있습니다.</p>`}</div></section>`:'';
 const steps=['일기 읽기','자료 확인','미션'];const cur=st<=n?0:st===n+1?1:2;
 return `<div class="chapter"><div class="chapterhead"><div class="chapterlabel">CHAPTER ${String(ci+1).padStart(2,'0')} / 06 · ${esc(c.year)}</div><h1>${esc(c.name)}</h1><p>${esc(c.sub)}</p></div><div class="chapterbody">${eventBox(c)}${timeline(c.tl)}${whoCards(c)}<ol class="steps">${steps.map((x,i)=>`<li class="${i<cur?'done':i===cur?'cur':''}">${i+1}. ${x}</li>`).join('')}</ol>${journal}${archive}${gate}${missions}<div class="stagebottom"><button class="secondary" ${ci===0?'disabled':''} data-nav="${ci-1}">← 이전 일기</button>${st>0?`<button class="secondary" data-redo="${ci}">↺ 이 장 다시 풀기</button>`:''}${success?`<button class="primary" data-next="${ci+1}">${ci===5?'서술형 기록 완성하기':'다음 일기 열기 →'}</button>`:`<span class="status">${st>=n+2?'미션 진행 중':'일기를 끝까지 읽어 주세요'}</span>`}</div></div>${sourceNote()}</div>`}
function sourceNote(){return `<div class="sources"><details><summary>실제 역사 자료의 출처와 사용 안내</summary><ul>${Object.values(photos).map(p=>`<li>${esc(p.caption)} — ${esc(p.credit)} <a href="${sourceFor(p)}" rel="noopener noreferrer" target="_blank">원본</a></li>`).join('')}</ul><p>가상 일기는 실제 1차 사료가 아닌 학습용 재구성문입니다. 사진과 동시대 지도는 역사 자료입니다. 이미지 파일은 인터넷 연결 시 위키미디어 공용에서 불러옵니다.</p></details></div>`}
function finalView(){return `<div class="chapter"><div class="chapterhead"><div class="chapterlabel">FINAL ARCHIVE · HISTORICAL WRITING</div><h1>러시아 혁명, 역사 기록 완성</h1><p>세 사람이 남긴 단서를 떠올리며 자신의 문장으로 답하라.</p></div><div class="chapterbody">${timeline([0,1,2,3,4,5,6,7])}<div class="essayhead"><h2>학습지 정리 · 러시아 혁명</h2><p style="line-height:1.9;color:var(--muted)">서술형을 쓰기 전에 수업 학습지의 정리 표를 먼저 채워 보세요.</p></div>${sheetView()}<div class="essayhead" style="margin-top:30px"><h2 style="font-size:24px">서술형 3문항 · 총 8점</h2><p style="line-height:1.9;color:var(--muted)">먼저 스스로 답을 쓴 뒤 모범 답안을 펼쳐 비교하세요. <b>자동 채점은 하지 않습니다.</b> 평가 기준의 핵심 요소를 직접 확인합니다.</p></div>${finalQuestions.map((q,i)=>`<div class="essaybox"><div class="points">서술형 ${i+1} · ${q.points}점</div><h3>${esc(q.title)}</h3><textarea data-essay="${i}" placeholder="사건의 원인·결과가 드러나도록 자신의 문장으로 적어 보세요.">${esc(state.final[i]||'')}</textarea><div class="actions"><button class="secondary" data-model="${i}" ${!(state.final[i]||'').trim()?'disabled':''}>${state.models[i]?'모범 답안 닫기':'내 답안과 비교하기'}</button><span class="tiny">답안을 작성해야 비교할 수 있어요.</span></div>${state.models[i]?`<div class="model"><b>모범 답안</b>${esc(q.model)}<div class="key"><b>핵심 확인:</b> ${q.keys.map(esc).join(' · ')}</div></div>`:''}</div>`).join('')}<div class="essaybox"><div class="points">마무리 질문</div><h3>최초의 사회주의 국가는 왜 러시아에서 등장했을까? 세 사람의 일기를 떠올리며 한두 문장으로 정리해 보세요.</h3><textarea data-big placeholder="예: 차르(황제)의 전제정치, 전쟁, 굶주림 …">${esc(state.big||'')}</textarea><div class="actions"><button class="secondary" data-bigmodel>${state.bigShow?'예시 답안 닫기':'예시 답안 보기'}</button></div>${state.bigShow?`<div class="model"><b>예시 답안</b>차르(황제)의 전제정치와 러일 전쟁 패배, 제1차 세계 대전으로 인한 굶주림과 희생으로 민중의 불만이 컸고, 1917년 3월 혁명 뒤 세워진 임시정부도 전쟁을 계속하며 토지·식량 문제를 해결하지 못했다. 그러자 “평화·토지·빵”을 약속한 레닌의 볼셰비키가 노동자·농민·군인의 지지를 얻어 1917년 11월 혁명을 일으켰기 때문이다.</div>`:''}</div><div class="finalbanner"><b>최종 점검</b><br>① 1917년 3월 혁명 뒤 세워진 임시정부는 왜 민중의 지지를 잃었는가?<br>② 1917년 11월 혁명이 세계사적으로 중요한 이유는 무엇인가?<br>③ 레닌 이후 스탈린 통치의 한계는 무엇인가?<br><span style="font-size:12px;color:#dfd4c6">세 가지를 자기 말로 설명할 수 있다면 활동 목표에 도달한 것입니다.</span></div><div class="submitbox"><h3>선생님께 제출하기</h3><p class="tiny">서술형 3문항을 모두 쓰면 제출할 수 있어요. 학번과 이름을 꼭 확인하세요.</p><div class="entryrow"><div><label for="sno">학번</label><input id="sno" autocomplete="off" maxlength="15" value="${esc(state.studentNo)}"></div><div><label for="sname">이름</label><input id="sname" autocomplete="off" maxlength="20" value="${esc(state.student)}"></div><button class="primary" id="submit" ${state.final.some(x=>!x.trim())?'disabled':''}>${state.submittedAt?'다시 제출하기':'선생님께 제출하기'}</button></div><div id="submitmsg" class="${state.submittedAt?'feedback good':''}" aria-live="polite">${state.submittedAt?`✓ ${esc(state.submittedAt)}에 제출했어요.`:''}</div><div class="redo"><b>다시 풀고 싶다면?</b> 왼쪽 목록(휴대폰에서는 화면 위쪽 목록)에서 장 번호를 누르면 그 장으로 돌아가요. 각 장 아래의 <b>‘이 장 다시 풀기’</b>를 누르면 일기 읽기부터 미션까지 처음처럼 다시 할 수 있어요. 고친 뒤 다시 제출하면 선생님 시트의 답안이 최신 것으로 바뀌어요.</div></div><div class="actions"><button class="secondary" id="download" ${state.final.some(x=>!x.trim())?'disabled':''}>내 기록 파일로 저장 (.txt)</button><button class="secondary" id="print">작성한 답안 인쇄</button><button class="secondary" data-nav="5">← 마지막 일기 다시 보기</button></div></div>${sourceNote()}</div>`}
function normA(t){return String(t||'').replace(/[\s·()]/g,'').toLowerCase()}
function sheetOk(id,ans){return state.sheet[id]===ans}
function sheetView(){let n=0,total=0;const rows=sheet.map((r,ri)=>`<tr><th>${r.k}</th><td>${r.parts.map((p,pi)=>{if(typeof p==='string')return p;const id=ri+'-'+pi;total++;const ok=sheetOk(id,p.a);if(ok)n++;const cls=state.sheetChecked?(ok?'ok':'no'):'';return `<select class="blank ${cls}" data-sheet="${id}" aria-label="빈칸 ${total}"><option value="">선택 ▾</option>${p.o.map(x=>`<option ${state.sheet[id]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${state.sheetChecked&&!ok&&state.sheetShow?`<span class="sheetans">${esc(p.a)}</span>`:''}`}).join('')}</td></tr>`).join('');
 return `<div class="sheetwrap"><table class="sheet"><thead><tr><th>요인</th><th>내용</th></tr></thead><tbody>${rows}</tbody></table></div><p class="tiny" style="margin:10px 0 0">빈칸을 눌러 알맞은 말을 고르세요. · 소비에트: 노동자와 군인으로 이루어진 대표 회의</p><div class="actions"><button class="primary" data-sheetcheck>정리 표 채점하기</button><button class="secondary" data-sheetshow ${state.sheetChecked?'':'disabled'}>${state.sheetShow?'정답 숨기기':'틀린 칸 정답 보기'}</button><button class="secondary" data-sheetreset>다시 풀기</button>${state.sheetChecked?`<span class="status">${n} / ${total} 정답</span>`:''}</div>`}
function render(){document.getElementById('app').innerHTML=topbar()+`<div class="layout">${nav()}<main class="main">${state.stage<0?intro():state.stage===6?finalView():chapterView(state.stage)}<div class="sourcefoot">세 개의 일기, 하나의 혁명 · 중학교 2학년 세계사 | 사실 기반 가상 일기 + 실제 역사 자료</div></main></div>`;bind()}
function goto(stage){if(stage>state.maxStage)return;if(stage===6&&state.done.length!==6)return;state.stage=stage;save();render();window.scrollTo({top:0,behavior:'instant'})}
function bind(){document.querySelectorAll('[data-nav]').forEach(x=>x.addEventListener('click',()=>goto(+x.dataset.nav)));
 const begin=document.getElementById('begin');if(begin)begin.addEventListener('click',()=>{const no=document.getElementById('no').value.trim(),name=document.getElementById('name').value.trim();state.studentNo=no;state.student=name;state.stage=0;state.maxStage=Math.max(0,state.maxStage);save();render();window.scrollTo(0,0)});
 const reset=document.getElementById('reset');if(reset)reset.addEventListener('click',()=>{if(reset.dataset.armed!=='1'){reset.dataset.armed='1';reset.textContent='기록이 모두 지워져요. 한 번 더 누르면 처음부터';setTimeout(()=>{if(reset.isConnected){reset.dataset.armed='';reset.textContent='처음부터 다시'}},4000);return}{try{localStorage.removeItem(saveKey)}catch(e){}state={student:'',studentNo:'',stage:-1,maxStage:0,done:[],answers:{},final:['','',''],models:[false,false,false],sheet:{},sheetChecked:false,big:'',read:{}};render()}});
 document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{const [ch,q,i]=el.dataset.choice.split('|');const item=chapters[+ch].questions[+q];let a=getAns(+ch,+q);if(item.type==='multi'){a=Array.isArray(a)?[...a]:[];if(a.includes(+i))a=a.filter(x=>x!==+i);else a.push(+i);setAns(ch,q,a)}else setAns(ch,q,+i);updateAndRender(+ch)}));
 document.querySelectorAll('[data-match]').forEach(el=>el.addEventListener('change',()=>{const [ch,q,i]=el.dataset.match.split('|');let a=getAns(+ch,+q);a=Array.isArray(a)?[...a]:['','',''];a[+i]=el.value;setAns(ch,q,a);updateAndRender(+ch)}));
 document.querySelectorAll('[data-order]').forEach(el=>el.addEventListener('click',()=>{const [ch,q,id]=el.dataset.order.split('|');let a=getAns(+ch,+q);a=Array.isArray(a)?[...a]:[];if(!a.includes(id)){a.push(id);setAns(ch,q,a);updateAndRender(+ch)}}));
 document.querySelectorAll('[data-orderreset]').forEach(el=>el.addEventListener('click',()=>{const [ch,q]=el.dataset.orderreset.split('|');setAns(ch,q,[]);updateAndRender(+ch)}));
 document.querySelectorAll('[data-next]').forEach(el=>el.addEventListener('click',()=>{const next=+el.dataset.next;if(state.stage<6 && !doneCh(state.stage))return;if(state.stage===5 && state.done.length===6){state.maxStage=6;save()}goto(next)}));
 document.querySelectorAll('[data-essay]').forEach(el=>el.addEventListener('input',()=>{const i=+el.dataset.essay;state.final[i]=el.value;save();const b=document.querySelector(`[data-model="${i}"]`);if(b)b.disabled=!el.value.trim();const d=document.getElementById('download');if(d)d.disabled=state.final.some(x=>!x.trim())}));
 document.querySelectorAll('[data-model]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.model;if(!state.final[i].trim())return;state.models[i]=!state.models[i];save();const pos=window.scrollY;render();window.scrollTo(0,pos)}));
 document.querySelectorAll('[data-read]').forEach(el=>el.addEventListener('click',()=>{const ci=+el.dataset.read;if(!state.read||typeof state.read!=='object')state.read={};state.read[ci]=readStep(ci)+1;save();const pos=window.scrollY;render();window.scrollTo(0,pos);const t=document.querySelectorAll('.reveal-new');const last=t[t.length-1];if(last&&last.scrollIntoView)last.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}));
 document.querySelectorAll('[data-sheet]').forEach(el=>el.addEventListener('change',()=>{state.sheet[el.dataset.sheet]=el.value;el.classList.remove('ok','no');save()}));
 document.querySelectorAll('[data-sheetcheck]').forEach(el=>el.addEventListener('click',()=>{state.sheetChecked=true;save();const pos=window.scrollY;render();window.scrollTo(0,pos)}));
 document.querySelectorAll('[data-sheetshow]').forEach(el=>el.addEventListener('click',()=>{state.sheetShow=!state.sheetShow;save();const pos=window.scrollY;render();window.scrollTo(0,pos)}));
 document.querySelectorAll('[data-sheetreset]').forEach(el=>el.addEventListener('click',()=>{state.sheet={};state.sheetChecked=false;state.sheetShow=false;save();const pos=window.scrollY;render();window.scrollTo(0,pos)}));
 document.querySelectorAll('[data-big]').forEach(el=>el.addEventListener('input',()=>{state.big=el.value;save()}));
 document.querySelectorAll('[data-bigmodel]').forEach(el=>el.addEventListener('click',()=>{state.bigShow=!state.bigShow;save();const pos=window.scrollY;render();window.scrollTo(0,pos)}));
 document.querySelectorAll('[data-redo]').forEach(el=>el.addEventListener('click',()=>{const ci=+el.dataset.redo;if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='한 번 더 누르면 이 장을 처음부터';setTimeout(()=>{if(el.isConnected){el.dataset.armed='';el.textContent='↺ 이 장 다시 풀기'}},4000);return}chapters[ci].questions.forEach((q,qi)=>{delete state.answers[`${ci}-${qi}`]});if(!state.read)state.read={};state.read[ci]=0;state.done=state.done.filter(x=>x!==ci);save();render();window.scrollTo(0,0)}));
 ['sno','sname'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{if(id==='sno')state.studentNo=el.value.trim();else state.student=el.value.trim();save()})});
 const sb=document.getElementById('submit');if(sb)sb.addEventListener('click',submitToTeacher);
 const d=document.getElementById('download');if(d)d.addEventListener('click',downloadTxt);const p=document.getElementById('print');if(p)p.addEventListener('click',()=>window.print());}
function updateAndRender(ch){if(doneCh(ch)){if(!state.done.includes(ch))state.done.push(ch);state.maxStage=Math.max(state.maxStage,ch+1)}else{state.done=state.done.filter(x=>x!==ch); // 이미 완료한 이후 장은 이동 가능하나, 최종 기록 전에는 모든 장을 다시 완수해야 함
}save();const pos=window.scrollY;render();window.scrollTo(0,pos)}
function submitToTeacher(){const msg=document.getElementById('submitmsg'),btn=document.getElementById('submit');const show=(t,ok)=>{msg.className='feedback '+(ok?'good':'bad');msg.textContent=t};
 if(!state.studentNo||!state.student){show('학번과 이름을 모두 입력해 주세요.',false);return}
 if(state.final.some(x=>!x.trim())){show('서술형 3문항을 모두 작성해야 제출할 수 있어요.',false);return}
 if(!SUBMIT_URL){show('아직 선생님의 제출 주소가 연결되지 않았어요. 선생님께 알려 주세요.',false);return}
 const sheetTotal=sheet.reduce((a,r)=>a+r.parts.filter(x=>typeof x!=='string').length,0);
 const sheetRight=sheet.reduce((a,r,ri)=>a+r.parts.filter((x,pi)=>typeof x!=='string'&&state.sheet[ri+'-'+pi]===x.a).length,0);
 const data={activity:'russia-revolution',no:state.studentNo,name:state.student,chapters:`${state.done.length} / ${chapters.length}`,sheet:`${sheetRight} / ${sheetTotal}`,e1:state.final[0],e2:state.final[1],e3:state.final[2],big:state.big||''};
 btn.disabled=true;show('제출하는 중이에요…',true);
 fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
  .then(()=>{const t=new Date();state.submittedAt=`${t.getMonth()+1}월 ${t.getDate()}일 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;save();show(`✓ ${state.submittedAt}에 제출했어요. 고친 뒤 다시 제출하면 최신 답안으로 바뀌어요.`,true);btn.textContent='다시 제출하기'})
  .catch(()=>show('제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.',false))
  .finally(()=>{btn.disabled=false})}
function downloadTxt(){const lines=['세 개의 일기, 하나의 혁명 - 러시아 혁명 역사 기록',`학번: ${state.studentNo}`,`이름: ${state.student}`,'','※ 자동 채점이 아닌 학생이 직접 작성한 답안입니다.',''];finalQuestions.forEach((q,i)=>{lines.push(`${i+1}. ${q.title}`,`답안: ${state.final[i]||''}`,'')});lines.push('마무리. 최초의 사회주의 국가는 왜 러시아에서 등장했을까?',`답안: ${state.big||''}`,'');const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=`러시아혁명_역사기록_${(state.studentNo||'학생').replace(/[^0-9a-zA-Z가-힣_-]/g,'')}_${(state.student||'').replace(/[^0-9a-zA-Z가-힣_-]/g,'')}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),500)}
render();
</script>
</body>
</html>
