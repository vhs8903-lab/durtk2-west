<style>
:root{--ink:#273048;--navy:#172743;--blue:#28487a;--gold:#ae782d;--line:#cbb992;--paper:#fcf7e9;--cream:#f2e6c9;--green:#27745c;--red:#a83f35}

.page{overflow:visible;min-width:0;background:linear-gradient(125deg,#fdfaf1,#ede3cd);border:6px double #b59c72;border-radius:16px;min-height:650px;padding:25px;box-shadow:0 10px 38px #09122670}.eyebrow{display:inline-block;border-radius:8px;background:var(--navy);color:#e8c17c;padding:6px 13px;font-size:12px;font-weight:800;letter-spacing:.08em}.title{font-family:Georgia,'Batang',serif;font-weight:900;color:#273653;font-size:clamp(23px,3vw,32px);margin:13px 0 7px}.subtitle{color:#695c47;margin:0 0 21px}.divider{border:0;border-top:1px solid #c9b690;margin:17px 0}.panel{background:rgba(255,255,255,.66);border:1px solid #c8b894;border-radius:12px;padding:18px}.stage{display:grid;grid-template-columns:minmax(185px,240px) minmax(0,1fr);gap:20px;align-items:start}.stage.dual{grid-template-columns:280px minmax(0,1fr)}.portrait{min-width:0;background:linear-gradient(#b7a282,#ded0b2);border:6px solid #735532;outline:3px solid #dbc18a;border-radius:13px;overflow:hidden;box-shadow:0 7px 16px #463d3470;position:relative}.portrait img{display:block;width:100%;height:auto;aspect-ratio:1/1.12;object-fit:contain;background:#bbad95}.portrait .name{background:#2b2938;color:#f5db9b;text-align:center;padding:9px;font-weight:800}.portrait.duo{display:grid;grid-template-columns:1fr 1fr;gap:2px}.portrait.duo .person img{height:auto;aspect-ratio:1/1.08;width:100%;object-fit:contain}.portrait.duo .name{font-size:12px;padding:7px 3px}.speech{background:#fffef9;border:2px solid #d5b878;border-radius:20px;padding:21px 23px;min-height:205px;box-shadow:0 4px 14px #2c292015;position:relative;font-size:clamp(16px,1.7vw,19px);line-height:1.85;word-break:keep-all}.speech:before{content:' ';position:absolute;left:-13px;top:34px;width:20px;height:20px;background:#fffef9;transform:rotate(45deg);border-left:2px solid #d5b878;border-bottom:2px solid #d5b878}.speech strong{background:linear-gradient(transparent 49%,#ffe29c 49%);color:#683a1b}.speaker{color:#a56c26;font-weight:900;font-size:14px;margin-bottom:9px}.question{padding:19px 22px;background:#d8e7ff;border:2px solid #3969a9;border-left:9px solid #214e8a;border-radius:14px;margin:14px 0 20px;font-weight:900;font-size:clamp(19px,2.2vw,24px);line-height:1.65;color:#163b6a;box-shadow:0 3px 12px #385f9a24}.small{font-size:13px;color:#6e624f}.stepdots{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 15px}.dots{display:flex;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#d3c5a9}.dot.on{background:#375c97}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:19px;flex-wrap:wrap}.btn{border:1px solid #8f6d3a;background:#fff9e9;color:#473b2a;font-weight:800;border-radius:11px;padding:11px 17px;min-height:44px;box-shadow:0 2px 0 #84683d20}.btn.primary{background:linear-gradient(#355b96,#203d72);border-color:#1e345a;color:white}.btn.success{background:linear-gradient(#388a6e,#23674e);color:white;border-color:#1e573f}.btn:hover:not(:disabled){filter:brightness(1.08)}.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #dfaa36;outline-offset:2px}.chip{padding:7px 11px;background:#ede4d2;border:1px solid #c9b997;border-radius:8px;font-weight:700;font-size:14px}.keybox{margin-top:17px;padding:12px 16px;background:#f5e7bd;border:1px solid #ccb077;border-radius:10px;font-size:14px}.keybox strong{color:#735126}.notice{border-left:5px solid #a37c40;background:#f5ebd3;padding:13px 15px;border-radius:8px;font-size:15px;line-height:1.8}.notice strong{color:#8e5220}.options{display:grid;gap:9px;margin-top:15px}.option{width:100%;text-align:left;border:1px solid #d1bf99;border-radius:9px;padding:13px 15px;background:white;font-weight:700;color:#273b54}.option.selected{background:#dfeaff;border-color:#4878be}.option.wrong{border-color:#bc695b;background:#fff0ee}.option.correct{background:#def4e8;border-color:#4a9471}.quiz-title{font-size:21px;font-weight:900;color:#34486c;margin-bottom:9px}.feedback{margin-top:15px;font-weight:800;padding:11px 14px;border-radius:9px;background:#e9eef6}.feedback.ok{background:#d9f2e6;color:#175d47}.feedback.err{background:#ffe7e1;color:#903e34}.orderlist{display:grid;gap:7px;margin:15px 0}.orderrow{display:flex;gap:8px;align-items:center;background:white;border:1px solid #c7b794;padding:8px;border-radius:8px}.orderrow .idx{font-weight:900;color:#8d682e;width:25px;text-align:center}.orderrow .desc{flex:1;font-weight:700}.arrowBtn{border:1px solid #ccc0a8;border-radius:7px;background:#f6efdf;padding:5px 10px}.bank{display:flex;flex-wrap:wrap;gap:9px;background:#e2e9f4;border:1px dashed #90a3bf;padding:15px;border-radius:9px;margin:13px 0}.word{border:1px solid #d1aa67;background:#fef3d5;border-radius:9px;padding:9px 13px;font-weight:800;color:#55401c;min-height:42px}.word.picked{background:#2b548e;color:white}.word:disabled{visibility:hidden}.fillrows{display:grid;gap:11px}.fillrow{line-height:2;word-break:keep-all;background:#fffdf7;border:1px solid #d6c8aa;border-radius:9px;padding:11px}.slot{display:inline-block;border:2px dashed #6384b8;border-radius:8px;color:#2b5284;background:#f1f5ff;font-size:14px;font-weight:800;min-width:115px;padding:6px 10px;vertical-align:middle}.slot.hint{background:#e7f5ff}.matchrows{display:grid;gap:12px}.matchrow{padding:12px;border:1px solid #cbbb9e;background:#fffdfa;border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,220px);align-items:center;gap:10px}.matchrow select{width:100%;padding:10px;border:1px solid #a89a7b;border-radius:7px;background:#f4f7fa;color:#29354c;font-weight:700}.finalrow{display:grid;grid-template-columns:80px minmax(0,1fr);align-items:start;gap:10px;padding:13px 0;border-bottom:1px dashed #c7b99a}.year{color:#335a95;font-weight:900}.medal{font-size:70px;text-align:center;filter:drop-shadow(0 5px 10px #bc8d48)}.nameform{display:grid;grid-template-columns:1fr 1fr;gap:13px}.nameform label{display:flex;flex-direction:column;gap:6px;font-weight:800}.nameform input{width:100%;padding:14px;border:1px solid #b9a888;border-radius:9px;background:#fffef9}.pill{padding:6px 10px;border:1px solid #aa936b;border-radius:20px;font-size:12px;color:#665537}.foot{color:#ddccab;text-align:center;font-size:12px;margin-top:14px;padding:8px}.shadowhint{font-size:14px;color:#5b6d83;margin-bottom:8px}.endIntro{font-size:16px;line-height:1.8}.hero{background:radial-gradient(circle at 80% 20%,#fff6d0,#e9d6a6 60%,#dcc49c);border:2px solid #ae8c51;border-radius:14px;padding:20px;text-align:center}.hero h2{color:#583b19;font-family:Georgia,'Batang',serif;font-size:30px;margin:6px}.hero p{line-height:1.8}.social{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;background:#263e67;color:#f6d391;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:900}.revisit{font-size:13px;color:#846537;padding:7px 0}.print{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.rail>strong{width:100%}.navitem{width:calc(33.333% - 5px);margin:0;min-height:59px}.navitem img{width:38px;height:42px}.status{width:100%;margin:4px}.stage,.stage.dual{grid-template-columns:180px minmax(0,1fr)}.portrait img{height:auto}}@media(max-width:620px){.wrap{padding:8px}.top{padding:13px}.top .stamp{display:none}.page{padding:13px;min-height:580px}.rail{padding:9px}.navitem{width:calc(50% - 4px)}.stage,.stage.dual{grid-template-columns:1fr}.portrait{max-width:200px;margin:0 auto}.portrait img{height:auto}.portrait.duo{max-width:320px}.portrait.duo .person img{height:auto}.speech{font-size:16px;min-height:130px;padding:16px}.speech:before{display:none}.matchrow{grid-template-columns:1fr}.finalrow{grid-template-columns:65px 1fr}.nameform{grid-template-columns:1fr}.actions .btn{flex:1}.btn{padding:11px 9px}}

.orderrow{touch-action:none;min-height:66px;user-select:none;cursor:grab;transition:background .16s,outline .16s}

.matchcol{display:grid;gap:12px;align-content:start}.matchnode{position:relative;z-index:2;border:2px solid #8ea5c5;border-radius:11px;padding:12px 13px;background:#fffef9;min-height:58px;text-align:left;font-size:14px;font-weight:800;color:#25416e;line-height:1.5;touch-action:none;user-select:none;cursor:crosshair}

.matchsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}.matchsvg line{stroke:#3671a0;stroke-width:3;stroke-linecap:round}.matchsvg line.pending{stroke:#c08b3f;stroke-dasharray:6 4}

/* Question transition: a deliberate new-question checkpoint */
.question-gate{max-width:850px;margin:25px auto 12px;padding:clamp(22px,4vw,45px);background:linear-gradient(140deg,#e9f2ff,#f8f4e9 75%);border:3px solid #385f9b;border-radius:22px;box-shadow:0 16px 35px rgba(25,52,86,.2);animation:questionArrive .6s both;position:relative;overflow:visible}
.question-gate .qflag{display:inline-flex;border-radius:999px;background:#214e8a;color:white;font-weight:900;padding:8px 16px;letter-spacing:.03em}
.question-gate .qtitle{font-size:clamp(25px,4vw,39px);line-height:1.48;font-weight:900;color:#143967;margin:22px 0;overflow-wrap:anywhere}

.question-gate .qactions button{min-height:54px;font-size:17px;padding:12px 24px}
.question-gate .qmark{font-size:56px;display:block;margin-top:6px}
@keyframes questionArrive{0%{opacity:0;transform:translateY(25px) scale(.97)}70%{opacity:1;transform:translateY(-4px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
.dialogue-appear{animation:answerArrive .35s ease-out both}
@keyframes answerArrive{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.question-gate,.dialogue-appear{animation:none}}
</style></head><body><div class="wrap"><header class="top"><div><small>HISTORY QUEST · 세계사 복습 프로젝트</small><h1>격동의 유럽, 혁명의 증언자들</h1><small>프랑스 혁명에서 이탈리아·독일 통일까지 · 7명 · 6개 챕터</small></div><div class="stamp">✦</div></header><div class="shell"><aside class="rail"><strong>📜 역사 속 여정</strong><div id="nav"></div><div class="status" id="status"></div></aside><main id="app" class="page"></main></div><div class="foot">인물 대사는 역사적 사실을 학습하기 위해 각색한 가상 인터뷰입니다. · 본 페이지는 학생 학습용 초안입니다.</div></div>
<script>const DATA={"chapters":[{"title":"루이 16세","sub":"혁명은 왜 시작되었을까?","dates":"1789~1793","people":["louis"],"intro":["나는 프랑스의 국왕 *루이 16세*요. 나라를 다스리는 것은 왕의 당연한 권한 아니겠소?","그런데 요즘 백성들이 나를 비난하고 있으니 도무지 이해할 수 없구려!"],"talks":[{"q":"국민들이 왜 그렇게 불만이 많은지 모르시겠습니까?","a":["성직자와 귀족이 특권을 누리는 것은 오래전부터 이어진 질서요. 평민들이 세금을 많이 부담하는 것도 새삼스러운 일이 아니지 않소?","나라의 재정이 어려워진 것은 전쟁에 큰돈을 썼기 때문이오. *미국 독립 전쟁*도 도와주었고 말이오."]},{"q":"그래서 삼부회를 소집하셨나요?","a":["그렇소. 재정 문제를 해결하려고 *삼부회*를 불렀지. 그런데 제3신분 대표들이 *신분별 표결*에 불만을 품고 자기들끼리 *국민 의회*를 만들지 않았겠소!","심지어 *테니스코트*에서 헌법을 만들 때까지 해산하지 않겠다고 맹세했소. 왕의 권위에 도전하다니!"]},{"q":"그런데 파리 시민들은 바스티유 감옥까지 습격했습니다.","a":["왕이 군대를 동원해 국민 의회를 탄압할 것이라는 불안이 커졌고, 시민들은 무기를 구하려고 1789년 *바스티유 감옥*을 습격했소.","이제는 백성들이 왕에게 맞서기까지 하는구려. 도대체 이 나라가 어디로 가려는 것인지!"]}],"record":["*1792년* 왕정이 폐지되고 공화정이 수립되었다.","*1793년* 루이 16세는 처형되었다."],"tasks":[{"kind":"choice","title":"구제도의 모순","prompt":"프랑스 혁명 이전의 신분제 사회에 관한 옳은 설명을 고르세요.","options":["모든 신분이 동일한 세금을 부담했다.","제3신분이 정치적 특권을 독점했다.","제1·2신분은 특권을 누리고 제3신분은 무거운 세금을 부담했다."],"right":2},{"kind":"order","title":"혁명의 사건을 순서대로","prompt":"아래 사건들을 오래된 순서대로 배열하세요.","items":["삼부회 소집","국민 의회 결성·테니스코트의 선언","바스티유 감옥 습격","공화정 수립(1792)과 루이 16세 처형(1793)"]}]},{"title":"로베스피에르","sub":"혁명을 지키기 위해서였소!","dates":"1793~1795","people":["robespierre"],"intro":["나는 *로베스피에르*! 왕정을 무너뜨리고 공화정을 세운 혁명의 지도자 중 한 사람이오.","루이 16세는 처형되었고, 이제 프랑스의 주인은 왕이 아니라 국민이오. 하지만 혁명은 아직 끝나지 않았소!"],"talks":[{"q":"왕정도 무너졌는데 왜 혼란이 계속되었나요?","a":["국내에는 여전히 왕정을 되살리려는 세력이 있었고, 외국의 군주들도 프랑스 혁명을 위협했소.","혁명을 지키기 위해서는 *강력한 조치*가 필요했지."]},{"q":"당신이 공포 정치를 실시했다고 하는데요?","a":["혁명의 적들로부터 공화국을 지키기 위해 강경한 정치를 펼친 것이오.","혁명에 반대한다고 판단한 사람들을 체포하고 처형했지. 나는 혁명을 보호하려 했지만, 사람들은 점점 두려움을 느끼고 반발하기 시작했소."]}],"record":["*1794년* 로베스피에르는 반대 세력에 의해 실각하고 처형되었다.","이후 *1795년*, 한 사람에게 권력이 집중되는 것을 막기 위해 *5명의 총재가 공동으로 행정권을 행사하는 총재 정부*가 수립되었다."],"tasks":[{"kind":"fill","title":"공포 정치와 5인 총재 정부","prompt":"사건을 복원하는 데 필요한 용어를 빈칸에 넣으세요.","lines":[["로베스피에르는 혁명을 지키겠다며","공포 정치","를 실시했다."],["그의 몰락 이후 5명의 총재가 공동으로 행정권을 행사하는","총재 정부","가 수립되었다."]],"bank":["총재 정부","공포 정치"]}]},{"title":"나폴레옹","sub":"프랑스의 위기에서 유럽의 황제까지","dates":"1799~1815","people":["napoleon"],"intro":["나는 *나폴레옹 보나파르트*! 프랑스 혁명 이후 오스트리아를 비롯한 주변 군주국들은 혁명이 자기 나라로 퍼질 것을 두려워해 연합하여 프랑스와 전쟁을 벌였지.","하지만 *5명의 총재*가 행정권을 행사하던 *총재 정부*는 이런 위기에 제대로 대응하지 못했어. 나는 전쟁터에서 승리를 거두며 국민의 지지를 얻었지.","그리고 *1799년 쿠데타*로 총재 정부를 무너뜨리고 권력을 장악했어!"],"talks":[{"q":"권력을 장악한 뒤에는 어떤 일을 하셨나요?","a":["나는 프랑스의 혼란을 수습하고 국가 질서를 바로잡았지. 특히 *나폴레옹 법전*을 편찬하고 행정 제도를 정비했어.","*나폴레옹 법전*은 *법 앞의 평등*과 *사유 재산권 보장* 등 프랑스 혁명의 성과를 법으로 확립했다는 점에서 중요한 의미가 있지.","이러한 성과로 국민들의 강력한 지지를 얻었고, *1804년*에는 그 지지를 바탕으로 스스로 *황제*의 자리에 올랐지!"]},{"q":"유럽 여러 나라와 전쟁을 벌인 이유는 무엇인가요?","a":["주변 나라의 왕들은 *프랑스 혁명이 자기 나라로 퍼질 것을 두려워했지*. 그래서 힘을 합쳐 우리 프랑스를 위협했다네!","나는 그 위협을 막아야 했고, 더 나아가 *프랑스의 영향력을 유럽 전역으로 넓히고자* 했지.","그 결과 여러 전쟁에서 승리하며 유럽의 넓은 지역을 지배하게 되었어!"]},{"q":"그토록 강했던 나폴레옹은 왜 몰락했나요?","a":["수많은 전쟁에서 승리해 유럽의 넓은 지역을 내 발아래 두었지만, *영국*만은 굴복시킬 수 없었어.","그래서 유럽 여러 나라가 영국과 교역하지 못하도록 *대륙 봉쇄령*을 내렸지.","그런데 *러시아*가 이를 따르지 않자 직접 *러시아 원정*에 나섰다가 엄청난 피해를 입었어. 결국 연합군에 패배하며 몰락했지."]}],"record":[],"tasks":[{"kind":"fill","title":"나폴레옹 몰락의 연결 고리","prompt":"영국을 굴복시키려던 정책부터 몰락까지의 흐름을 완성하세요.","lines":[["영국에 대한 경제적 압박을 위해","대륙 봉쇄령","을 내렸다."],["이를 따르지 않은","러시아","에 원정을 나섰다가 큰 피해를 입었다."],["이후 나폴레옹의 세력이 약해지고 마침내","몰락","하였다."]],"bank":["러시아","몰락","대륙 봉쇄령"]},{"kind":"match","title":"정책과 결과 연결","prompt":"각 사건과 관련된 설명을 선택하세요.","rows":[["1799년 쿠데타","총재 정부 붕괴와 권력 장악"],["나폴레옹 법전","법 앞의 평등 등 혁명 성과의 제도화"],["대륙 봉쇄령","영국에 대한 경제적 압박"],["러시아 원정 실패","나폴레옹 세력의 약화"]]}]},{"title":"메테르니히","sub":"혁명 이전의 질서로 돌아가야 하오!","dates":"1814~1848+","people":["metternich"],"intro":["나는 오스트리아의 외무장관 *메테르니히*요! 마침내 나폴레옹이 몰락했소. 이제 유럽을 뒤흔든 혁명과 전쟁을 끝내야 하오.","그래서 1814년부터 오스트리아의 *빈*에 유럽 여러 나라의 대표들이 모여 *빈 회의*를 열었소. 내가 그 회의를 주도했지.","우리는 *프랑스 혁명 이전의 정통 왕조와 기존 질서*를 회복하려 했소. 이렇게 세워진 유럽의 국제 질서를 *빈 체제*라고 부르오!"],"talks":[{"q":"그렇다면 빈 체제는 잘 유지되었나요?","a":["잘 유지되었느냐고? 처음에는 질서가 잡히는 듯했소. 그런데 *자유주의*와 *민족주의*를 주장하는 사람들이 계속 반발하지 않겠소!","프랑스에서는 *1830년 7월 혁명*으로 샤를 10세가 물러났고, *1848년 2월 혁명*으로 다시 왕정이 무너져 공화정이 수립되었소!","영국에서도 노동자들이 *차티스트 운동*을 벌여 선거권 확대를 요구하고 있소. 도대체 왜들 가만히 있지를 못하는 것이오!","그뿐이 아니오! 이탈리아와 독일에서도 민족주의자들이 통일을 추진했소. 훗날 전쟁을 거쳐 두 나라가 통일되면서, 내가 지키려던 *빈 체제의 질서도 결국 무너졌지*!"]}],"record":["*인터뷰 연출 안내:* 마지막 대사는 메테르니히 사후의 이탈리아(1861)·독일(1871) 통일까지 내다보는 가상 회고이다.","*메테르니히는 1859년 사망*했으므로 실제로 두 통일을 목격하지는 못했다."],"tasks":[{"kind":"choice","title":"빈 체제의 목표","prompt":"빈 체제가 추구한 목표를 고르세요.","options":["혁명 이전의 왕조와 전통적 지배 질서 회복","유럽 모든 국가의 즉각적인 공화정 수립","모든 민족에게 즉각 독립 보장"],"right":0},{"kind":"match","title":"유럽 각지에서 도착한 신문","prompt":"역사 기록과 사건을 알맞게 연결하세요.","rows":[["1830년 샤를 10세가 물러남","7월 혁명"],["1848년 프랑스 제2공화정 수립","2월 혁명"],["영국 노동자들의 선거권 확대 요구","차티스트 운동"]]}]},{"title":"카보우르와 가리발디","sub":"이탈리아는 하나가 되어야 한다!","dates":"1859~1870","people":["cavour","garibaldi"],"intro":[["cavour","나는 사르데냐 왕국의 재상 *카보우르*요! 빈 체제가 수립되었지만 이탈리아는 여전히 여러 나라로 나뉘어 있었소. 북부 일부 지역은 오스트리아의 지배를 받고 있었지."],["garibaldi","나는 *가리발디*요! 빈 체제가 아무리 기존 질서를 유지하려 해도 우리는 포기할 수 없었소. 이탈리아 사람들이 하나의 나라에서 살아야 하지 않겠소?"]],"talks":[{"q":"카보우르, 당신은 어떻게 이탈리아 통일을 추진했나요?","person":"cavour","a":["통일을 이루려면 강력한 오스트리아부터 몰아내야 했소. 그래서 *프랑스와 협력*해 오스트리아와 전쟁을 벌였지.","나는 외교와 전쟁을 활용해 *사르데냐 왕국*을 중심으로 북부 이탈리아의 통일을 추진했소."]},{"q":"가리발디, 당신은 어떤 역할을 했나요?","person":"garibaldi","a":["카보우르가 북부에서 통일을 추진하는 동안, 나는 *붉은 셔츠대*라는 의용군을 이끌고 남부로 향했소!","*시칠리아와 나폴리* 지역을 점령했지. 하지만 내가 직접 왕이 되려던 것은 아니오. 점령한 남부 지역을 *사르데냐 왕국의 국왕*에게 넘겨주었소."]},{"q":"그렇다면 이탈리아는 어떻게 하나의 나라가 되었나요?","a":[["cavour","북부와 남부의 통일 움직임이 합쳐져 *1861년 이탈리아 왕국*이 성립했소!"],["garibaldi","그 후 *베네치아*와 *로마*까지 통합하면서 통일이 완성되었지!"]]}],"record":[],"tasks":[{"kind":"order","title":"이탈리아 통일의 세 장면","prompt":"이탈리아 통일 과정을 오래된 순서대로 끌어 배열하세요.","items":["카보우르가 외교와 전쟁으로 북부 통일 추진","가리발디가 붉은 셔츠대를 이끌고 남부를 점령하고 국왕에게 넘김","1861년 이탈리아 왕국 수립"]}]},{"title":"비스마르크","sub":"철과 피로 독일을 통일하다!","dates":"1862~1871","people":["bismarck"],"intro":["나는 프로이센의 재상, *오토 폰 비스마르크*요! 나폴레옹 몰락 뒤 빈 체제가 수립되었지만 독일 지역은 여전히 여러 나라로 나뉘어 있었소.","메테르니히는 기존 질서를 유지하려 했지만, 나는 그것을 받아들일 수 없었소! *독일 민족이 하나의 강력한 국가*를 이루어야 한다고 생각했기 때문이지.","그래서 *프로이센*을 중심으로 독일을 통일하기로 결심했소!"],"talks":[{"q":"독일을 통일하기 위해 어떤 정책을 추진하셨나요?","a":["바로 *철혈 정책*이오! 나는 연설이나 다수결만으로는 독일 통일을 이룰 수 없다고 생각했소.","여기서 *철(鐵)*은 무기와 강력한 군사력, *혈(血)*은 전쟁에서 흘리는 피와 희생을 뜻하오.","즉 군사력을 강화하고 전쟁도 불사하면서 독일 통일을 추진한 것이오!"]},{"q":"철혈 정책으로 실제로 독일을 통일했나요?","a":["그렇소! 프로이센의 군사력을 강화하고 *오스트리아*와 전쟁해 독일 통일의 주도권을 장악했소.","이후 *프랑스*와의 전쟁에서도 승리했지. 마침내 *1871년 프로이센 중심의 독일 제국*이 수립되었소!"]}],"record":[],"tasks":[{"kind":"fill","title":"철혈 정책의 의미","prompt":"철과 혈이 각각 무엇을 뜻하는지 완성하세요.","lines":[["철(鐵)은","무기와 군사력","을 뜻한다."],["혈(血)은","전쟁과 희생","을 뜻한다."]],"bank":["전쟁과 희생","무기와 군사력"]},{"kind":"choice","title":"독일 통일의 중심 국가","prompt":"비스마르크가 통일을 추진한 중심 국가는 어디일까요?","options":["오스트리아","프로이센","프랑스"],"right":1}]}],"end":[["1789","프랑스에서는 구제도의 모순과 왕의 전제 정치에 반발하여","프랑스 혁명","이 일어났다."],["1793~1794","로베스피에르는","공포 정치","를 실시했다."],["1799~1804","나폴레옹은","총재 정부","를 무너뜨리고 권력을 장악해 황제가 되었다."],["1814~1815","나폴레옹 몰락 뒤 유럽의 주요 나라들은 혁명 이전 질서를 회복하려","빈 체제","를 수립했다."],["1830·1848","프랑스에서는","7월 혁명과 2월 혁명","이 잇따라 일어났다."],["1861","카보우르와 가리발디의 활약으로","이탈리아 왕국","이 수립되었다."],["1871","프로이센을 중심으로","독일 제국","이 수립되었다."]],"images":{"louis":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAFKASwDASIAAhEBAxEB/8QAHQAAAgMBAQEBAQAAAAAAAAAABgcEBQgDAgEJAP/EAD0QAAEDBAEDAwIFAwMDAwMFAAECAwQABQYREgchMRMiQRRRCCMyYXEVM0IWgZEkUqElNMFDYrEJJkRT8f/EABsBAAIDAQEBAAAAAAAAAAAAAAMEAQIFBgAH/8QAMxEAAgICAgEEAQIFAwMFAAAAAQIAAwQREiExBRMiQVEyYRQjcYGRobHBQtHwBiQz4fH/2gAMAwEAAhEDEQA/AMcyrnEu9idlukMPEa4o7GjPpb1BucoxsAkvBMGSe7rp8ClO82lTy3GlFTWu4+1dY6liQ1JhPllbY/WPIpS7FS5Crf8A5I3qNrrrdcVjzGccsjAVLYALj6P0mk4Zq1McVpGh5+9fzzy5c9T02Spx3eitXzUN1JQ4r3HXx+9XxaBRWE3uV0Ny9jPfVsFwL4cU6CR81Ef+oPBT6BpJ9oIqHGS+kF1JIAFelzXpJSg/FG1LajFxPAps60i/uSW/TaWFhoHzqtHYd1tvyMZkWpuzBaYbekhKPOqyZjGVT7Vc2o70xYhlYCm/in1ZZ7cjIIqsfuKR6wHqs9vdXN+sYvv9XjY8j9oWpuPSnuWqZmR9bsgNmkS021nRBaJ4jdILqf06ufTbLV2me0XWCdokAe1X+9M7PJT+M9QI11stwdjONkKeaQnQUftTBuXUfp/1Z6fRrFlsdmBcf7 const chapters=DATA.chapters;const finalEntries=DATA.end;const images=DATA.images;
const STORAGE='europe_history_interview_draft_v1';
const ENDPOINT='https://script.google.com/macros/s/AKfycbyUihFXvnGnEHVbXNBEmN7L1eYuZm40FCLgGn7069nS2oyR20uNIRQGGwfRrKemvjfO5Q/exec';
const initial=()=>({studentId:'',studentName:'',chapter:0,mode:'welcome',introPos:0,talkPos:0,partPos:0,taskPos:0,taskData:{},completed:[],firstResult:{},attempts:{},finalAnswers:{},finalChecked:false,finalDone:false,medal:false,submitted:false,submissionId:'',sending:false,doneAt:''});
let s=initial();try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&typeof v==='object')s={...s,...v};}catch(e){};
if(s.mode==='welcome'&&s.chapter>0)s.mode='intro';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rich(v){return esc(v).replace(/\*([^*]+)\*/g,'<strong>$1</strong>');}
function el(id){return document.getElementById(id)}
function btn(label,func,variant='primary',disabled=false){return `<button class="btn ${variant}" ${disabled?'disabled':''} onclick="${func}">${label}</button>`}
function progress(){const finished=s.completed.length;return Math.round((finished+(s.mode==='final'?0.5:0)+(s.medal?0.5:0))/7*100)}
function nav(){let out='';chapters.forEach((c,i)=>{let unlocked=i===0||s.completed.includes(i-1)||s.completed.includes(i);let active=s.chapter===i&&s.mode!=='final'&&s.mode!=='result';out+=`<button class="navitem ${active?'active':''}" ${unlocked?'':'disabled'} onclick="jump(${i})"><img src="${images[c.people[0]]}" alt="${esc(c.title)} 초상"><span><b>${i+1}장 ${esc(c.title)}</b><small>${s.completed.includes(i)?'✓ 학습 완료':unlocked?'인터뷰하기':'🔒 앞 장을 완료하세요'}</small></span></button>`});out+=`<button class="navitem ${s.mode==='final'||s.mode==='result'?'active':''}" ${s.completed.length===6?'':'disabled'} onclick="openFinal()"><span class="num">★</span><span><b>최종 역사 복원</b><small>7개 키워드 완성</small></span></button>`;el('nav').innerHTML=out;el('status').innerHTML=`<b>나의 탐험 현황</b><div class="meter"><span style="width:${progress()}%"></span></div><div>${s.completed.length} / 6 챕터 완료 ${s.medal?' · 🏅 역사 메달 획득':''}</div>${s.studentName?`<small>${esc(s.studentId)} ${esc(s.studentName)}</small>`:''}`}
function render(){nav();const app=el('app');if(s.mode==='welcome')return welcome();if(s.mode==='result')return result();if(s.mode==='final')return final();if(s.chapter<0||s.chapter>=6){s.chapter=0;s.mode='intro'};if(s.mode==='intro')return intro();if(s.mode==='questionGate')return questionGate();if(s.mode==='dialogue')return dialogue();if(s.mode==='record')return record();if(s.mode==='quiz')return quiz();s.mode='intro';intro()}
function welcome(){el('app').innerHTML=`<div class="eyebrow">HISTORY QUEST · 시작하기</div><div class="hero"><div style="font-size:40px">⚜️ 📜 ⚔️</div><h2>격동의 유럽, 혁명의 증언자들</h2><p>왕의 목소리부터 혁명 지도자와 통일의 주역까지.<br>역사적 인물 <b>7명</b>을 인터뷰하고 <b>6개의 챕터</b>를 완성하세요.</p></div><div class="panel" style="margin-top:18px"><h3>🎓 탐험을 시작하기 전에</h3><p class="small">인물의 주장을 그대로 믿기보다 역사 기록과 비교해 보세요. 중요한 말은 나눠서 제시되며, 각 챕터의 확인 문제를 풀어야 다음 단계가 열립니다. 틀려도 다시 도전할 수 있어요.</p><div class="nameform"><label>학번<input id="studentId" inputmode="numeric" maxlength="7" placeholder="예: 20212" value="${esc(s.studentId)}"></label><label>이름<input id="studentName" maxlength="30" placeholder="이름 입력" value="${esc(s.studentName)}"></label></div><div class="actions">${btn('새 탐험 시작하기 →','start()')}</div><div id="msg" role="status"></div></div>`}
function start(){const id=el('studentId').value.trim(),name=el('studentName').value.trim();if(!/^\d{4,7}$/.test(id)||!name){el('msg').innerHTML='<p class="feedback err">학번(숫자 4~7자리)과 이름을 정확히 입력하세요.</p>';return};s=initial();s.studentId=id;s.studentName=name;s.mode='intro';save();render()}
function jump(i){if(i===0||s.completed.includes(i-1)||s.completed.includes(i)){s.chapter=i;s.mode='intro';s.introPos=0;s.talkPos=0;s.partPos=0;s.taskPos=0;save();render()}}
function header(c,pre){return `<span class="eyebrow">CHAPTER ${s.chapter+1} · ${esc(c.dates)}</span><h2 class="title">${esc(c.title)} — ${esc(c.sub)}</h2><p class="subtitle">${esc(pre)}</p>`}
function portraits(c,active){let isdual=c.people.length===2;return `<div class="portrait ${isdual?'duo':''}">${c.people.map(p=>`<div class="person"><img src="${images[p]}" alt="${esc(personName(p))} 인물 삽화"/><div class="name">${personName(p)}</div></div>`).join('')}</div>`}
const personN={louis:'루이 16세',robespierre:'로베스피에르',napoleon:'나폴레옹',metternich:'메테르니히',cavour:'카보우르',garibaldi:'가리발디',bismarck:'비스마르크'};
function personName(p){return personN[p]||p}
function speaker(c,unit,defaultPerson){if(Array.isArray(unit))return {person:unit[0],text:unit[1]};return {person:defaultPerson||c.people[0],text:unit}}
function intro(){const c=chapters[s.chapter];let a=speaker(c,c.intro[s.introPos]);el('app').innerHTML=header(c,'인물의 첫인사를 들어보세요.')+`<div class="stepdots"><span class="badge">인물 자기소개</span><div class="dots">${c.intro.map((_,i)=>`<span class="dot ${i<=s.introPos?'on':''}"></span>`).join('')}</div><span class="small">${s.introPos+1} / ${c.intro.length}</span></div><section class="stage ${c.people.length>1?'dual':''}">${portraits(c)}<div><div class="speech"><div class="speaker">${personName(a.person)}의 이야기</div>${rich(a.text)}</div><div class="actions">${btn('← 이전 대사','prevIntro()','',s.introPos===0)}${btn(s.introPos===c.intro.length-1?'인터뷰 질문 보기 →':'다음 대사 →','nextIntro()')}</div></div></section><div class="keybox">💡 핵심어는 <b>노란 밑줄</b>로 강조했어요. 인물의 관점이 담긴 대사임을 기억하세요.</div>`}
function prevIntro(){if(s.introPos>0){s.introPos--;save();render()}}
function nextIntro(){const c=chapters[s.chapter];if(s.introPos<c.intro.length-1)s.introPos++;else{s.mode='questionGate';s.talkPos=0;s.partPos=0};save();render()}
function questionGate(){
 const c=chapters[s.chapter],t=c.talks[s.talkPos];
 el('app').innerHTML=header(c,'새로운 질문이 도착했어요. 질문을 확인하고 답변을 들어 보세요.')+`<section class="question-gate" aria-labelledby="activeQuestion" role="region"><span class="qflag">🎤 새로운 질문 ${s.talkPos+1} / ${c.talks.length}</span><span class="qmark" aria-hidden="true">❝</span><div id="activeQuestion" class="qtitle">${esc(t.q)}</div><div class="qhelp">질문을 읽었다면 아래 버튼을 눌러 ${esc(c.title)}의 대답을 들어 보세요.</div><div class="qactions">${btn('← 이전 내용','backQuestionGate()','')}${btn('✓ 질문 확인하고 답변 듣기 →','ackQuestion()','primary')}</div></section>`;
}
function ackQuestion(){if(s.mode!=='questionGate')return;s.mode='dialogue';s.partPos=0;save();render()}
function backQuestionGate(){if(s.talkPos===0){s.mode='intro';s.introPos=chapters[s.chapter].intro.length-1;}else{s.talkPos--;s.partPos=chapters[s.chapter].talks[s.talkPos].a.length-1;s.mode='dialogue'}save();render()}
function dialogue(){const c=chapters[s.chapter],t=c.talks[s.talkPos];let a=speaker(c,t.a[s.partPos],t.person);el('app').innerHTML=header(c,'질문을 읽고 인물의 답변을 끝까지 확인하세요.')+`<div class="stepdots"><span class="badge">인터뷰 질문 ${s.talkPos+1} / ${c.talks.length}</span><div class="dots">${t.a.map((_,i)=>`<span class="dot ${i<=s.partPos?'on':''}"></span>`).join('')}</div><span class="small">답변 ${s.partPos+1} / ${t.a.length}</span></div><div class="question dialogue-appear">🎤 질문: ${esc(t.q)}</div><div class="stage ${c.people.length>1?'dual':''}">${portraits(c)}<div><div class="speech"><div class="speaker">${personName(a.person)}의 답변</div>${rich(a.text)}</div><div class="actions">${btn('← 이전 대사','prevPart()','',s.talkPos===0&&s.partPos===0)}${btn(s.partPos===t.a.length-1?(s.talkPos===c.talks.length-1?'역사 기록·확인 문제 →':'다음 질문으로 →'):'다음 대사 →','nextPart()')}</div></div></div>`}
function prevPart(){if(s.partPos>0)s.partPos--;else if(s.talkPos>0){s.talkPos--;s.partPos=chapters[s.chapter].talks[s.talkPos].a.length-1}else{s.mode='intro';s.introPos=chapters[s.chapter].intro.length-1}save();render()}
function nextPart(){let c=chapters[s.chapter],t=c.talks[s.talkPos];if(s.partPos<t.a.length-1)s.partPos++;else if(s.talkPos<c.talks.length-1){s.talkPos++;s.partPos=0;s.mode='questionGate'}else{s.mode=c.record.length?'record':'quiz';s.taskPos=0}save();render()}
function record(){const c=chapters[s.chapter];el('app').innerHTML=header(c,'인터뷰 뒤에 일어난 역사적 사건을 확인하세요.')+`<div class="panel"><div style="font-size:39px">📰</div><h3>역사 기록 — 인물의 말과 사실 구분하기</h3>${c.record.map(x=>`<div class="notice" style="margin-top:10px">${rich(x)}</div>`).join('')}<div class="actions">${btn('← 인터뷰 다시 보기','backRecord()','')}${btn('확인 문제 풀기 →','goQuiz()')}</div></div>`}
function backRecord(){s.mode='dialogue';s.talkPos=chapters[s.chapter].talks.length-1;s.partPos=chapters[s.chapter].talks[s.talkPos].a.length-1;save();render()}
function goQuiz(){s.mode='quiz';s.taskPos=0;save();render()}
function taskId(){return `${s.chapter}-${s.taskPos}`}
function getTask(){return chapters[s.chapter].tasks[s.taskPos]}
function tstate(){const k=taskId();if(!s.taskData[k])s.taskData[k]={};return s.taskData[k]}
function quiz(){const c=chapters[s.chapter],t=getTask(),d=tstate();let inner='';let foot=`<div id="feedback" role="status"></div><div class="actions">${btn('📜 인터뷰 다시 읽기','reviewTalk()','')}${btn('정답 확인하기','checkTask()')}</div>`;
if(t.kind==='choice'){inner=`<div class="options">${t.options.map((a,i)=>`<button class="option ${d.selected===i?'selected':''}" onclick="selectChoice(${i})">${['①','②','③','④'][i]} ${esc(a)}</button>`).join('')}</div>`}
if(t.kind==='order'){if(!d.order)d.order=t.items.map((_,i)=>i).reverse();inner=`<div class="orderguide">☝️ 사건 카드를 길게 누른 뒤 원하는 자리로 끌어 놓으세요. (마우스·태블릿 지원)</div><div class="orderlist" id="orderlist">${d.order.map((x,i)=>`<div class="orderrow" draggable="true" data-index="${i}" ondragstart="orderDragStart(event,${i})" ondragover="orderDragOver(event,${i})" ondragleave="orderDragLeave(event)" ondrop="orderDrop(event,${i})" ondragend="orderDragEnd(event)"><span class="draghandle" aria-hidden="true">⠿</span><span class="idx">${i+1}</span><span class="desc">${esc(t.items[x])}</span></div>`).join('')}</div>`}
if(t.kind==='fill'){inner=`<p class="small">① 단어를 선택하고 ② 빈칸을 눌러 넣으세요. 채운 칸을 다시 누르면 단어가 돌아옵니다.</p><div class="bank">${t.bank.map(w=>`<button class="word ${d.picked===w?'picked':''}" ${Object.values(d.words||{}).includes(w)?'disabled':''} onclick="pickWord('${esc(w)}')">${esc(w)}</button>`).join('')}</div><div class="fillrows">${t.lines.map((line,i)=>`<div class="fillrow">${rich(line[0])} <button class="slot" onclick="putWord(${i})">${esc((d.words||{})[i]||'여기에 배치')}</button> ${rich(line[2])}</div>`).join('')}</div>`}
if(t.kind==='match'){let distinct=[...new Set(t.rows.map(x=>x[1]))];d.rightOrder??=distinct.map((_,i)=>i).reverse();inner=`<p class="orderguide">왼쪽 사건에서 오른쪽 결과까지 손가락이나 마우스로 선을 그으세요. 양쪽을 차례로 눌러도 연결돼요.</p><div class="matchboard" id="matchboard"><svg class="matchsvg" id="matchsvg" aria-hidden="true"></svg><div class="matchcol">${t.rows.map((r,i)=>`<button class="matchnode left ${d.activeLine===i?'active':''}" data-left="${i}" onpointerdown="linePointerStart(event,${i})" onclick="linePickLeft(${i})">${esc(r[0])}</button>`).join('')}</div><div class="matchcol">${d.rightOrder.map((j,k)=>`<button class="matchnode right" data-right="${k}" onpointerup="linePointerEnd(event,${k})" onclick="linePickRight(${k})">${esc(distinct[j])}</button>`).join('')}</div></div>`}
el('app').innerHTML=header(c,'인물의 이야기를 바탕으로 확인 문제를 풀어보세요.')+`<div class="panel"><div class="stepdots"><span class="badge">확인 활동 ${s.taskPos+1} / ${c.tasks.length}</span><span class="pill">틀려도 다시 도전 가능</span></div><div class="quiz-title">${esc(t.title)}</div><p>${esc(t.prompt)}</p>${inner}${foot}</div>`;if(t.kind==='order')attachTouchOrder();if(t.kind==='match')requestAnimationFrame(drawLines);save()}
function selectChoice(i){tstate().selected=i;save();render()}
function moveOrder(i,dir){let d=tstate(),j=i+dir;if(j<0||j>=d.order.length)return;[d.order[i],d.order[j]]=[d.order[j],d.order[i]];save();render()}

let orderStartIndex=-1,orderTouchActive=false;
function moveOrderTo(from,to){let d=tstate();if(from<0||to<0||from===to)return;const [v]=d.order.splice(from,1);d.order.splice(to,0,v);save();render()}
function orderDragStart(e,i){orderStartIndex=i;if(e.dataTransfer){e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'}e.currentTarget.classList.add('dragging')}
function orderDragOver(e,i){e.preventDefault();e.currentTarget.classList.add('drop-target')}
function orderDragLeave(e){e.currentTarget.classList.remove('drop-target')}
function orderDrop(e,i){e.preventDefault();moveOrderTo(orderStartIndex,i);orderStartIndex=-1}
function orderDragEnd(e){orderStartIndex=-1;document.querySelectorAll('.orderrow').forEach(x=>x.classList.remove('dragging','drop-target'))}
function attachTouchOrder(){let startY=0,from=-1,dragging=false,active=null;
 const root=el('orderlist');if(!root)return;
 root.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const row=e.target.closest('.orderrow');if(!row)return;active=row;from=Number(row.dataset.index);startY=e.clientY;dragging=true;row.classList.add('dragging');},{passive:true});
 root.addEventListener('pointermove',e=>{if(!dragging)return;const dy=e.clientY-startY;if(Math.abs(dy)>9){e.preventDefault();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.orderrow');document.querySelectorAll('.orderrow').forEach(x=>x.classList.remove('drop-target'));if(target)target.classList.add('drop-target')}},{passive:false});
 root.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const row=document.elementFromPoint(e.clientX,e.clientY)?.closest('.orderrow');const to=row&&root.contains(row)?Number(row.dataset.index):-1;if(to>=0&&to!==from){moveOrderTo(from,to)}else{document.querySelectorAll('.orderrow').forEach(x=>x.classList.remove('dragging','drop-target'))}});
 root.addEventListener('pointercancel',()=>{dragging=false;document.querySelectorAll('.orderrow').forEach(x=>x.classList.remove('dragging','drop-target'))});
}
let pointerFrom=-1,pointerXY=null;
function matchRightLabels(){return [...new Set(getTask().rows.map(r=>r[1]))]}
function labelForRight(j){const d=tstate();return matchRightLabels()[d.rightOrder[j]]}
function linePickLeft(i){const d=tstate();d.activeLine=i;save();drawLines()}
function connectLine(i,j){if(i<0||j<0)return;const d=tstate();d.matches??={};const label=labelForRight(j);for(const [k,v] of Object.entries(d.matches)){if(v===label&&Number(k)!==i)delete d.matches[k]};d.matches[i]=label;d.activeLine=undefined;pointerFrom=-1;save();render()}
function linePickRight(j){const i=tstate().activeLine;if(Number.isInteger(i))connectLine(i,j)}
function linePointerStart(e,i){if(e.pointerType==='mouse'&&e.button!==0)return;pointerFrom=i;pointerXY={x:e.clientX,y:e.clientY};tstate().activeLine=i;save();drawLines()}
function linePointerEnd(e,j){if(pointerFrom>=0){connectLine(pointerFrom,j);e.preventDefault()}}
document.addEventListener('pointerup',e=>{if(pointerFrom<0)return;const node=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-right]');if(node){connectLine(pointerFrom,Number(node.dataset.right))}else{pointerFrom=-1;pointerXY=null;drawLines()}});
function drawLines(){const board=el('matchboard'),svg=el('matchsvg');if(!board||!svg)return;const d=tstate(),r=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';const labels=matchRightLabels();for(const [index,value] of Object.entries(d.matches||{})){const left=board.querySelector(`[data-left="${index}"]`),rpos=d.rightOrder.indexOf(labels.indexOf(value)),right=board.querySelector(`[data-right="${rpos}"]`);if(!left||!right)continue;const a=left.getBoundingClientRect(),b=right.getBoundingClientRect();svg.innerHTML+=`<line x1="${a.right-r.left}" y1="${a.top-r.top+a.height/2}" x2="${b.left-r.left}" y2="${b.top-r.top+b.height/2}" />`;} }
window.addEventListener('resize',()=>{if(s.mode==='quiz'&&getTask().kind==='match')drawLines()});

function pickWord(w){tstate().picked=w;save();render()}
function putWord(i){let d=tstate();if(!d.words)d.words={};if(d.words[i]){delete d.words[i]}else if(d.picked){d.words[i]=d.picked;d.picked=''}save();render()}
function dropWord(e,i){e.preventDefault();const w=e.dataTransfer.getData('text/plain'),d=tstate(),t=getTask();if(!t.bank.includes(w)||Object.values(d.words||{}).includes(w))return;if(!d.words)d.words={};d.words[i]=w;d.picked='';save();render()}
function setMatch(i,w){let d=tstate();if(!d.matches)d.matches={};d.matches[i]=w;save()}
function showFeedback(ok,message){const f=el('feedback');if(f)f.innerHTML=`<div class="feedback ${ok?'ok':'err'}">${esc(message)}</div>`}
function checkTask(){const t=getTask(),d=tstate(),id=taskId();let enough=false,correct=false;if(t.kind==='choice'){enough=d.selected!==undefined;correct=d.selected===t.right}if(t.kind==='order'){enough=true;correct=d.order.every((x,i)=>x===i)}if(t.kind==='fill'){enough=Object.keys(d.words||{}).length===t.lines.length;correct=t.lines.every((l,i)=>(d.words||{})[i]===l[1])}if(t.kind==='match'){enough=t.rows.every((r,i)=>(d.matches||{})[i]);correct=t.rows.every((r,i)=>(d.matches||{})[i]===r[1])}if(!enough){showFeedback(false,'모든 선택과 빈칸을 채운 뒤 확인해 보세요.');return}if(!(id in s.firstResult))s.firstResult[id]=correct;s.attempts[id]=(s.attempts[id]||0)+1;save();if(!correct){showFeedback(false,'아직 맞지 않는 부분이 있어요. 대사와 역사 기록을 참고해 다시 도전하세요.');return}const next=(s.taskPos<chapters[s.chapter].tasks.length-1);el('feedback').innerHTML=`<div class="feedback ok">✓ 정답입니다! 핵심 내용을 정확히 이해했어요.</div><div class="actions">${btn(next?'다음 확인 활동 →':'챕터 완료 →','finishTask()','success')}</div>`;const buttons=el('app').querySelectorAll('button[onclick="checkTask()"]');buttons.forEach(b=>b.disabled=true)}
function finishTask(){const c=chapters[s.chapter];if(s.taskPos<c.tasks.length-1){s.taskPos++;s.mode='quiz'}else{if(!s.completed.includes(s.chapter))s.completed.push(s.chapter);if(s.chapter<5){s.chapter++;s.mode='intro';s.introPos=0;s.talkPos=0;s.partPos=0;s.taskPos=0}else{s.mode='final';s.finalChecked=false}}save();render()}
function reviewTalk(){s.mode= 'dialogue';s.talkPos=0;s.partPos=0;save();render()}
function openFinal(){if(s.completed.length!==6)return;s.mode=s.medal?'result':'final';save();render()}
function final(){const list=finalEntries;const words=['독일 제국','공포 정치','프랑스 혁명','이탈리아 왕국','빈 체제','총재 정부','7월 혁명과 2월 혁명'];const used=Object.values(s.finalAnswers);el('app').innerHTML=`<span class="eyebrow">★ FINAL MISSION</span><h2 class="title">격동의 유럽, 역사의 흐름을 완성하라!</h2><p class="endIntro">사건은 <b>시간순</b>으로 정리되어 있습니다. 역사 인물들의 인터뷰를 떠올리며 <b>키워드 7개</b>를 올바른 문장에 넣어 보세요.</p><div class="panel"><p class="shadowhint">💡 단어 선택 → 빈칸 터치 방식이며, 태블릿에서는 단어를 끌어서 놓을 수도 있어요.</p><div class="bank">${words.map(w=>`<button class="word ${s.pickedFinal===w?'picked':''}" draggable="true" ondragstart="startDrag(event,'${w}')" ${used.includes(w)?'disabled':''} onclick="pickFinal('${w}')">${w}</button>`).join('')}</div>${list.map((r,i)=>`<div class="finalrow"><span class="year">${esc(r[0])}</span><div>${esc(r[1])} <button class="slot ${s.finalAnswers[i]?'hint':''}" ondragover="event.preventDefault()" ondrop="dropFinal(event,${i})" onclick="placeFinal(${i})">${esc(s.finalAnswers[i]||'＋ 키워드')}</button> ${esc(r[3])}</div></div>`).join('')}<div id="feedback" role="status"></div><div class="actions">${btn('처음부터 다시 배치','clearFinal()','')}${btn('역사의 흐름 확인하기','checkFinal()','primary',Object.keys(s.finalAnswers).length!==7)}</div></div>`;if(s.finalChecked){let right=list.every((r,i)=>s.finalAnswers[i]===r[2]);showFeedback(right,'정답! 모든 키워드를 맞췄어요. 역사 메달을 획득했습니다.');}save()}
function pickFinal(w){s.pickedFinal=w;save();render()}
function placeFinal(i){if(s.finalAnswers[i]){delete s.finalAnswers[i]}else if(s.pickedFinal){s.finalAnswers[i]=s.pickedFinal;s.pickedFinal=''}s.finalChecked=false;save();render()}
function startDrag(e,w){e.dataTransfer.setData('text/plain',w);e.dataTransfer.effectAllowed='move'}
function dropFinal(e,i){e.preventDefault();const w=e.dataTransfer.getData('text/plain');const words=finalEntries.map(r=>r[2]);if(!words.includes(w)||Object.values(s.finalAnswers).includes(w))return;s.finalAnswers[i]=w;s.pickedFinal='';s.finalChecked=false;save();render()}
function clearFinal(){s.finalAnswers={};s.finalChecked=false;s.pickedFinal='';save();render()}
function checkFinal(){if(Object.keys(s.finalAnswers).length!==7){showFeedback(false,'키워드 7개를 모두 배치해 주세요.');return}const n=finalEntries.filter((r,i)=>s.finalAnswers[i]===r[2]).length;if(n!==7){showFeedback(false,`7개 중 ${n}개 정답입니다. 잘못된 단어를 눌러 다시 배치해 보세요.`);return}s.finalChecked=true;s.finalDone=true;s.medal=true;s.doneAt=new Date().toISOString();s.mode='result';save();render()}
function payload(){const qs=chapters.flatMap((c,i)=>c.tasks.map((t,j)=>({chapter:i+1,id:`${i}-${j}`,title:t.title,firstCorrect:s.firstResult[`${i}-${j}`]===true,attempts:s.attempts[`${i}-${j}`]||0,latestCorrect:true})));return {activityType:'europe_revolution_interviews_v1',studentId:s.studentId,studentName:s.studentName,completed:s.medal,medal:s.medal,chapterCount:s.completed.length,finalCorrect:s.finalDone?7:0,firstCorrect:qs.filter(x=>x.firstCorrect).length,totalQuestions:qs.length,answers:qs,finalKeywords:finalEntries.map((r,i)=>({year:r[0],keyword:s.finalAnswers[i]})),completedAt:s.doneAt}}
function result(){const p=payload();el('app').innerHTML=`<div class="hero"><div class="medal">🏅</div><span class="badge">HISTORY MEDAL · COMPLETE</span><h2>격동의 유럽 정복!</h2><p><b>${esc(s.studentName)}</b> 학생, 7명의 역사 인물과 함께한 6개 챕터를 모두 완성했어요.<br>프랑스 혁명에서 자유주의·민족주의 운동과 이탈리아·독일 통일까지 역사의 흐름을 연결했습니다.</p><div class="social" style="justify-content:center"><span class="chip">6 / 6 챕터</span><span class="chip">확인 활동 ${p.totalQuestions}개 완료</span><span class="chip">최초 정답 ${p.firstCorrect}개</span><span class="chip">최종 키워드 7 / 7</span></div></div><div class="panel" style="margin-top:17px"><h3>📒 나의 학습 결과</h3><p>학번: <b>${esc(s.studentId)}</b> · 이름: <b>${esc(s.studentName)}</b></p><p class="small">오답도 다시 풀 수 있어요. 처음 정답 여부와 재도전 횟수를 결과에 함께 기록했습니다.</p><div class="actions">${btn(s.submitted?'✓ 교사용 제출 완료':'📤 교사용 구글 시트에 제출하기','submitTeacher()','success',s.submitted||s.sending)}${btn('결과 파일 저장(.json)','downloadResult()','')}${btn('완성한 역사 흐름 다시 보기','reviewFinal()','')}</div><div id="submitStatus" class="submitstatus" role="status" aria-live="polite">${s.submitted?'✓ 교사용 구글 시트에 기록이 확인되었습니다.':'학교의 구글 시트에 결과를 제출하세요. 수신 확인 전에는 제출 완료로 표시하지 않습니다.'}</div></div>`}

function newSubmissionId(){if(window.crypto?.randomUUID)return 'eu_'+crypto.randomUUID().replace(/-/g,'')+'_hist';return 'eu_'+Date.now().toString(36)+'_'+Array.from({length:24},()=>Math.random().toString(36)[2]).join('')}
function postToSheet(data){
 const iframe=document.createElement('iframe');iframe.name='euPost'+Date.now();iframe.style.display='none';iframe.title='학습 제출 처리';
 const form=document.createElement('form');form.method='POST';form.action=ENDPOINT;form.target=iframe.name;form.style.display='none';form.enctype='application/x-www-form-urlencoded';
 const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(data);form.appendChild(input);
 document.body.append(iframe,form);form.submit();setTimeout(()=>{iframe.remove();form.remove()},90000);
}
function receiptCheck(id){return new Promise(resolve=>{
 const cb='euReceipt'+Math.random().toString(36).slice(2),tag=document.createElement('script');let done=false,timer;
 function finish(v){if(done)return;done=true;clearTimeout(timer);tag.remove();try{delete window[cb]}catch{window[cb]=undefined}resolve(v)}
 window[cb]=r=>finish({received:!!(r&&r.ok===true&&r.id===id&&r.received===true),error:r&&r.id===id?String(r.error||''):''});
 tag.onerror=()=>finish({received:false,error:'수신 확인 서버에 연결할 수 없습니다.'});
 tag.src=ENDPOINT+'?action=status&id='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
 timer=setTimeout(()=>finish({received:false,error:''}),10000);document.head.appendChild(tag);
})}
async function verifyReceipt(id){let lastError='';for(let k=0;k<9;k++){
 const res=await receiptCheck(id);if(res.received)return {ok:true,error:''};
 if(res.error && !/연결할 수 없습니다/.test(res.error))return {ok:false,error:res.error};
 if(res.error)lastError=res.error;
 if(k<8)await new Promise(r=>setTimeout(r,2000));
}return {ok:false,error:lastError||'시트에 아직 도착하지 않았습니다. Apps Script의 배포 주소·웹앱 접근 권한을 확인해 주세요.'}}
async function submitTeacher(){if(!s.medal||s.submitted||s.sending)return;
 s.sending=true;if(!s.submissionId)s.submissionId=newSubmissionId();save();
 const status=el('submitStatus');if(status)status.textContent='구글 시트에 제출 중… 이 화면에서 바로 수신 여부를 확인합니다.';
 try {
   postToSheet({submissionId:s.submissionId,result:payload()});
   const check=await verifyReceipt(s.submissionId);s.sending=false;s.submitted=check.ok;save();
   const st=el('submitStatus');if(st)st.textContent=check.ok?'✓ 제출 완료! 「유럽혁명」 시트에 실제 기록이 확인되었습니다.':('제출 미확인: '+check.error+'  학습을 다시 하지 않고 이 화면에서 재제출할 수 있습니다.');
   const b=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('교사용 구글 시트에 제출하기'));if(b)b.disabled=check.ok;
 }catch(e){s.sending=false;save();const st=el('submitStatus');if(st)st.textContent='제출 오류: '+String(e)+' / 학습을 다시 하지 않고 재시도할 수 있습니다.'}
}

function reviewFinal(){s.mode='final';save();render()}
function downloadResult(){const b=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`유럽혁명_${s.studentId}_${s.studentName.replace(/[^가-힣A-Za-z0-9]/g,'')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function resetAll(){if(confirm('지금까지 학습한 내용이 모두 삭제됩니다. 새로 시작할까요?')){s=initial();save();render()}}
render();</script></body></html>
