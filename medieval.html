<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>중세는 이제 안녕! · 세계사 시간 여행</title>
<style>
:root{--bg:#f6f2ea;--paper:#fffdf8;--ink:#16324f;--accent:#b77b2c;--accent2:#3f6b8e;--line:#d9cdb8;--good:#2f855a;--bad:#c05621;--soft:#eef3f7;}
*{box-sizing:border-box} body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:#1f2937;line-height:1.6}
button{font:inherit;cursor:pointer} .app{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.heroTitle{font-size:clamp(2rem,5vw,3rem);line-height:1.15;margin:0;color:var(--ink)}
.smallTitle{font-size:.98rem;color:#8b5b16;font-weight:800;letter-spacing:.03em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 26px rgba(33,45,60,.08)}
.section{padding:22px} .muted{color:#5f6b77;font-size:.95rem} .lead{font-size:1.08rem}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px} .primary,.secondary,.choiceBtn{border:none;border-radius:999px;padding:13px 20px;font-weight:800}
.primary{background:linear-gradient(135deg,var(--accent),#d59a45);color:white} .secondary{background:#e9eef3;color:#17334c}
.headerGrid{display:grid;grid-template-columns:1.25fr .9fr;gap:22px;align-items:stretch} @media (max-width:900px){.headerGrid{grid-template-columns:1fr}}
.heroImage{width:100%;height:100%;min-height:420px;object-fit:cover;object-position:center;border-radius:22px}.infoBox{padding:22px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px} @media (max-width:700px){.formGrid{grid-template-columns:1fr}}
input[type=text]{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #c8d0d8;background:white;font-size:1rem}
.mission{margin-top:18px;padding:18px;border-radius:18px;background:#fff6e8;border:1px solid #efd4a8}.mission h3{margin:0 0 10px;color:#7d4d0a}
.medalWrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px}.medal{position:relative;width:118px;height:118px;border-radius:50%;background:conic-gradient(#ddd 0 25%, #eee 25% 50%, #ddd 50% 75%, #eee 75% 100%);border:6px solid #d5b278;box-shadow: inset 0 0 0 4px rgba(255,255,255,.75), 0 8px 18px rgba(0,0,0,.12)}
.medal::before{content:'역사\A메달';white-space:pre;position:absolute;inset:25px;border-radius:50%;background:#fff9ef;display:grid;place-items:center;font-weight:900;color:#7a5120;line-height:1.1;text-align:center;font-size:1rem}
.medal .piece{position:absolute;inset:0;border-radius:50%;opacity:.18}.medal .p1{background:conic-gradient(from -90deg,#d89a3a 0 25%, transparent 25% 100%)}.medal .p2{background:conic-gradient(from 0deg,#d89a3a 0 25%, transparent 25% 100%)}.medal .p3{background:conic-gradient(from 90deg,#d89a3a 0 25%, transparent 25% 100%)}.medal .p4{background:conic-gradient(from 180deg,#d89a3a 0 25%, transparent 25% 100%)}.medal .on{opacity:1;filter:drop-shadow(0 0 5px rgba(215,145,47,.7))}
.medalPieces{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:10px;flex:1;min-width:280px}.pieceTag{padding:12px 14px;border-radius:16px;background:#eef3f7;border:1px solid #d6e0e8;font-weight:700}.pieceTag.done{background:#fff0cf;border-color:#e2ba63;color:#6f4a14}
.topBar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.progressPill{padding:8px 14px;border-radius:999px;background:#edf2f7;color:#1d3e5b;font-weight:800}
.chapterIntro h2{margin:.1rem 0 .3rem;color:var(--ink);font-size:clamp(1.8rem,4vw,2.4rem)}
.peopleGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:18px}.personCard{overflow:hidden;display:flex;flex-direction:column}.personCard img{width:100%;height:300px;object-fit:contain;object-position:center;background:#25384c;display:block}.personCard .body{padding:16px}.personCard h3{margin:0;color:var(--ink);font-size:1.5rem}.personMeta{color:#7d8792;font-size:.95rem;margin:4px 0 10px}
.dialogueWrap{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}@media (max-width:840px){.dialogueWrap{grid-template-columns:1fr}}
.portraitPanel img{width:100%;height:420px;object-fit:contain;object-position:center;background:#25384c;border-radius:24px;display:block}.portraitPanel .namePlate{margin-top:10px;font-size:1.55rem;color:var(--ink);font-weight:900}.portraitPanel .meta{color:#6d7680}
.bubbleArea{display:flex;flex-direction:column;gap:16px}.speech{position:relative;background:#f0f3f7;border:1px solid #d8e1e9;border-radius:26px;padding:22px 24px;min-height:135px;font-size:1.08rem}.speech::before{content:'';position:absolute;left:-16px;top:44px;border-width:12px 18px 12px 0;border-style:solid;border-color:transparent #d8e1e9 transparent transparent}.speech::after{content:'';position:absolute;left:-14px;top:45px;border-width:11px 17px 11px 0;border-style:solid;border-color:transparent #f0f3f7 transparent transparent}
.prompt{font-size:1.2rem;font-weight:900;color:var(--ink);margin-top:8px}.choiceList{display:flex;flex-direction:column;gap:12px}.choiceBtn{text-align:left;background:white;border:1px solid #cfd8e1;border-radius:18px;padding:16px 18px;color:#17324a}.choiceBtn::before{content:'💬 ';font-size:1.05rem}.answeredBadge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f5ea;color:#296341;font-weight:800;font-size:.88rem}
.insight{padding:18px;border-radius:20px;background:#fff9ec;border:1px solid #efdba7}.term-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}.term-card{background:white;border:1px solid #ead7aa;border-radius:16px;padding:14px}.term-card strong{display:block;color:#8c5a0d;font-size:1.1rem;margin-bottom:6px}
.quizCard{padding:22px}.quizTitle{font-size:1.7rem;margin:0;color:var(--ink)}.qNo{font-weight:900;color:#8d5e19}.options{display:grid;gap:10px;margin-top:16px}.option{padding:14px 16px;border-radius:16px;border:1px solid #cad4dd;background:white;text-align:left}.option:hover{background:#f7fafc}.feedback{margin-top:14px;padding:14px;border-radius:16px;background:#f4f7fa;border:1px solid #d8e1ea}.feedback.good{background:#edf8f0;border-color:#bde1c6}.feedback.bad{background:#fff1ea;border-color:#f2c0ab}
.reviewBlock{display:grid;gap:14px;margin-top:18px}.reviewItem{padding:16px;border-radius:18px;background:white;border:1px solid var(--line)}.reviewItem h4{margin:0 0 8px;color:var(--ink)}.statusGood{color:var(--good);font-weight:900}.statusBad{color:var(--bad);font-weight:900}.footerBtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.notice{padding:14px 16px;border-radius:16px;background:#eef4fa;border:1px solid #d4e0ed}

/* Four collectible segments of an embossed gold historical medallion */
.medalWrap{align-items:center}.medal{width:156px;height:156px;flex:none;border:none;background:#1d1b27;border-radius:24px;overflow:hidden;box-shadow:0 10px 24px #0003;isolation:isolate}
.medal::before{display:none!important}.medal .piece{display:none!important}
.medalArt,.medalReveal{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:24px}
.medalArt{filter:grayscale(1) brightness(.43);opacity:.75}
.medalReveal{opacity:0;transition:opacity .6s ease}
.medalReveal.on{opacity:1;filter:drop-shadow(0 0 8px #f7bd58)}
.medalReveal.q1{clip-path:polygon(0 0,50% 0,50% 50%,0 50%)}
.medalReveal.q2{clip-path:polygon(50% 0,100% 0,100% 50%,50% 50%)}
.medalReveal.q3{clip-path:polygon(0 50%,50% 50%,50% 100%,0 100%)}
.medalReveal.q4{clip-path:polygon(50% 50%,100% 50%,100% 100%,50% 100%)}
.medal.complete{box-shadow:0 0 38px #edbe48bb,0 10px 28px #0004;animation:medalGlow 1.7s ease-in-out infinite alternate}
@keyframes medalGlow{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.035);filter:brightness(1.14)}}
.visitBadge{background:#eaf4f1;border-radius:12px;padding:8px 12px;color:#27664d;font-weight:800}
.choiceBtn.visited{background:#eaf3e9;border-color:#82bd92}.choiceBtn.visited::after{content:'  ✓ 확인함';font-weight:800;color:#27664d}
@media(max-width:840px){.speech::before,.speech::after{display:none}.portraitPanel img{height:370px}}
@media print{.topBar,.footerBtns,button{display:none!important}.app{max-width:100%;padding:0}.card{box-shadow:none}.reviewItem{break-inside:avoid}.medal{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>

 const labels=CHAPTERS.map((c,i)=>`<div class="pieceTag ${STATE.medal[i]?'done':''}">${i+1}조각 · ${esc(c.piece)}</div>`).join('');
 const image=asset('medalArt');
 const reveal=[0,1,2,3].map((i)=>`<img class="medalReveal q${i+1} ${STATE.medal[i]?'on':''}" src="${image}" alt=""/>`).join('');
 const completed=STATE.medal.every(Boolean);
 return `<div class="medalWrap"><div class="medal ${completed?'complete':''}"><img class="medalArt" src="${image}" alt="역사 메달 장식"/>${reveal}</div><div class="medalPieces">${labels}</div></div>`
}
function startScreen(){shell(`
<div class="topBar"><div class="smallTitle">중학교 2학년 세계사 · 인터랙티브 복습</div><div class="progressPill">역사 메달 0 / 4</div></div>
<div class="card section">
  <h1 class="heroTitle">중세는 이제 안녕! 👋</h1>
  <p class="lead">중세 유럽의 질서가 어떻게 흔들리고, 근대 유럽의 새로운 모습이 등장했는지 시간 여행을 통해 살펴보는 복습 학습입니다.</p>
  <div class="formGrid">
    <label><div class="muted" style="margin-bottom:6px;font-weight:700">학번</div><input id="studentId" type="text" placeholder="예: 20212" /></label>
    <label><div class="muted" style="margin-bottom:6px;font-weight:700">이름</div><input id="studentName" type="text" placeholder="이름을 입력하세요" /></label>
  </div>
  <div id="startMsg" class="muted" style="margin-top:10px"></div>
  <div class="actions"><button class="primary" onclick="beginPrologue()">시간 여행 준비하기</button></div>
</div>`)}
function beginPrologue(){const sid=$('#studentId').value.trim(), nm=$('#studentName').value.trim(); if(!sid || !nm){$('#startMsg').innerHTML='학번과 이름을 모두 입력해 주세요.'; return} STATE.studentId=sid; STATE.studentName=nm; renderPrologue()}
function renderPrologue(){shell(`
<div class="topBar"><div class="smallTitle">시간 여행 프롤로그</div><div class="progressPill">학습자: ${esc(STATE.studentName)} (${esc(STATE.studentId)})</div></div>
<div class="headerGrid">
  <div class="card section"><img class="heroImage" src="${asset('hero')}" alt="중세 말 유럽의 시장과 성당 분위기를 재현한 이미지"></div>
  <div class="card infoBox">
    <div class="smallTitle">중세 말 유럽의 한 마을에 떨어졌습니다</div>
    <h1 class="heroTitle" style="font-size:2.2rem">시간 여행자의 임무</h1>
    <p class="lead">교회와 봉건 질서가 강하게 자리 잡은 중세 말 유럽. 이제 당신은 앞으로 일어날 거대한 변화를 살펴보기 위해 역사 속 인물들을 만나게 됩니다.</p>
    <div class="mission">
      <h3>역사 메달을 완성하세요!</h3>
      <p>대화에 참여하여 <b>중세에서 근대로 변화하는 특징</b>을 찾아보세요. 변화의 특징을 한 가지 찾을 때마다 <b>역사 메달 조각</b>을 모으게 됩니다. <b>네 개의 조각을 모아 역사 메달을 완성하세요!</b></p>
    </div>
    ${medalWidget()}
    <div class="actions"><button class="primary" onclick="renderChapter(0)">시간 여행 시작하기</button></div>
  </div>
</div>`)}
function chapterKey(cidx){return `c${cidx}`}
function doneCount(cidx){
 const done=STATE.personDone[chapterKey(cidx)]||{};
 return CHAPTERS[cidx].people.filter(p=>Object.keys(done[p.id]||{}).length>=p.choices.length).length;
}
function allPeopleDone(cidx){return doneCount(cidx)>=CHAPTERS[cidx].people.length}
function renderChapter(cidx){STATE.chapter=cidx; const c=CHAPTERS[cidx]; const cards=c.people.map((p,idx)=>{const progress=(STATE.personDone[chapterKey(cidx)]||{})[p.id]||{}; const d=Object.keys(progress).length>=p.choices.length; const desc=(cidx===0&&idx===0)?'교회의 부패와 권위에 도전한 인물입니다.':(cidx===2&&p.id==='elizabeth')?'영국의 무역 성장과 이후 재정 발전으로 이어지는 흐름을 살펴봅니다.':(cidx===3&&p.id==='voltaire')?'이성으로 사회를 비판하고 개선하려 한 계몽사상가입니다.':'이 인물과 짧게 대화하며 핵심 변화를 찾아보세요.'; return `<div class="card personCard"><img src="${asset(p.image)}" alt="${esc(p.name)}"><div class="body"><h3>${esc(p.name)}</h3><div class="personMeta">${esc(p.label)}</div><p>${desc}</p><div class="actions"><button class="primary" onclick="openDialogue(${cidx},${idx})">${d?'다시 보기':'대화하기'}</button>${d?'<span class="answeredBadge">대화 완료</span>':''}</div></div></div>`}).join('');
  shell(`
<div class="topBar"><div class="smallTitle">CHAPTER ${cidx+1}</div><div class="progressPill">역사 메달 ${STATE.medal.filter(Boolean).length} / 4</div></div>
<div class="card section chapterIntro">
  <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
    <div><h2>${esc(c.title)}</h2><p class="lead">${esc(c.subtitle)}</p><p class="muted">인물들과 짧은 대화에 참여하고, 변화의 특징을 확인한 뒤 <b>${esc(c.piece)}</b> 메달 조각에 도전하세요.</p></div>
    <div style="min-width:280px">${medalWidget()}</div>
  </div>
  <div class="peopleGrid">${cards}</div>
  <div class="actions">${allPeopleDone(cidx)?`<button class="primary" onclick="startQuiz(${cidx})">역사 메달 조각 얻기 도전!</button>`:`<button class="secondary" disabled>먼저 모든 인물과 대화해 보세요</button>`}</div>
</div>`)}
function openDialogue(cidx,pidx){
 const c=CHAPTERS[cidx], p=c.people[pidx], progress=(STATE.personDone[chapterKey(cidx)]||{})[p.id]||{};
 const count=Object.keys(progress).length;
 shell(`
<div class="topBar"><div class="smallTitle">인물과 대화하기 · ${esc(c.title)}</div><div class="progressPill">질문 ${count} / ${p.choices.length}개 확인</div></div>
<div class="card section">
 <div class="dialogueWrap">
  <div class="portraitPanel"><img src="${asset(p.image)}" alt="${esc(p.name)}"><div class="namePlate">${esc(p.name)}</div><div class="meta">${esc(p.label)}</div></div>
  <div class="bubbleArea">
   <div id="speechBox" class="speech">${p.speech}</div>
   <div class="prompt">당신은 뭐라고 말할까요?</div>
   <div class="choiceList">${p.choices.map((ch,idx)=>`<button class="choiceBtn ${progress[idx]?'visited':''}" id="dialogueChoice${idx}" onclick="answerDialogue(${cidx},${pidx},${idx})">${esc(ch.text)}</button>`).join('')}</div>
   <div id="afterDialogue"><div class="visitBadge">${count} / ${p.choices.length}개 질문 확인 · 모두 확인하면 다음으로 이동할 수 있어요.</div></div>
   <p class="muted" style="font-size:.82rem">인물의 대사는 역사적 사실을 바탕으로 재구성한 가상 대화입니다.</p>
  </div>
 </div>
</div>`)
}
function answerDialogue(cidx,pidx,choiceIdx){
 const p=CHAPTERS[cidx].people[pidx],ch=p.choices[choiceIdx];
 $('#speechBox').innerHTML=`<b>${esc(p.name)}:</b> ${ch.reply}`;
 const key=chapterKey(cidx); STATE.personDone[key]=STATE.personDone[key]||{};
 const progress=STATE.personDone[key][p.id]=STATE.personDone[key][p.id]||{};
 progress[choiceIdx]=true;
 for(let i=0;i<p.choices.length;i++){
   const btn=$('#dialogueChoice'+i);if(btn){btn.classList.toggle('visited',!!progress[i]);}
 }
 const count=Object.keys(progress).length;
 const done=count>=p.choices.length;
 const status=$('.progressPill');if(status)status.textContent=`질문 ${count} / ${p.choices.length}개 확인`;
 let html=`<div class="visitBadge">${done?'대화 완료! 두 가지 질문을 모두 확인했습니다.':`${count} / ${p.choices.length}개 질문 확인 · 다른 질문도 눌러보세요.`}</div>`;
 if(done){
   if(p.insight) html+=p.insight;
   html+=`<div class="actions">${allPeopleDone(cidx)?`<button class="primary" onclick="startQuiz(${cidx})">역사 메달 조각 얻기 도전!</button>`:`<button class="primary" onclick="renderChapter(${cidx})">다른 인물 만나러 가기</button>`}</div>`;
 }
 $('#afterDialogue').innerHTML=html;
}
function ensureAnswerRecord(qid, obj){let r=STATE.answers.find(x=>x.qid===qid); if(!r){r={qid,...obj, firstChoice:null, finalChoice:null, retries:0}; STATE.answers.push(r)} return r}
function startQuiz(cidx){STATE.currentQuizChapter=cidx; STATE.currentQuizIndex=0; renderQuizQuestion()}
function renderQuizQuestion(){const cidx=STATE.currentQuizChapter, c=CHAPTERS[cidx], qi=STATE.currentQuizIndex, q=c.quiz[qi], qid=`${cidx}-${qi}`; ensureAnswerRecord(qid,{chapter:c.title, chapterIndex:cidx, question:q.q, options:q.a, answer:q.a[q.c], why:q.why}); shell(`
<div class="topBar"><div class="smallTitle">역사 메달 조각 얻기 도전!</div><div class="progressPill">${STATE.currentQuizIndex+1} / ${c.quiz.length} 문항</div></div>
<div class="card quizCard">
  <div class="smallTitle">CHAPTER ${cidx+1} · ${esc(c.piece)}</div>
  <h2 class="quizTitle">${esc(c.title)}</h2>
  <p class="muted">대화를 통해 확인한 변화를 바탕으로 메달 조각을 획득해 보세요.</p>
  <div class="notice"><span class="qNo">문항 ${qi+1}.</span> ${esc(q.q)}</div>
  <div class="options">${q.a.map((opt,idx)=>`<button class="option" onclick="answerQuiz(${idx})">${idx+1}. ${esc(opt)}</button>`).join('')}</div>
  <div id="fb"></div>
</div>`)}
function answerQuiz(choiceIdx){const cidx=STATE.currentQuizChapter, c=CHAPTERS[cidx], qi=STATE.currentQuizIndex, q=c.quiz[qi], qid=`${cidx}-${qi}`; const rec=ensureAnswerRecord(qid,{chapter:c.title, chapterIndex:cidx, question:q.q, options:q.a, answer:q.a[q.c], why:q.why}); if(rec.firstChoice===null) rec.firstChoice=choiceIdx; else rec.retries += 1; rec.finalChoice=choiceIdx; if(choiceIdx===q.c){$('#fb').innerHTML=`<div class="feedback good"><b>정답!</b> ${q.why}</div><div class="actions"><button class="primary" onclick="nextQuiz()">${STATE.currentQuizIndex===c.quiz.length-1?'메달 조각 받기':'다음 문제'}</button></div>`} else {$('#fb').innerHTML=`<div class="feedback bad"><b>다시 생각해 보세요.</b> ${q.why}</div><div class="actions"><button class="secondary" onclick="renderQuizQuestion()">다시 도전</button></div>`}}
function nextQuiz(){const cidx=STATE.currentQuizChapter, c=CHAPTERS[cidx]; if(STATE.currentQuizIndex < c.quiz.length-1){STATE.currentQuizIndex++; renderQuizQuestion()} else {STATE.medal[cidx]=true; renderPieceAward(cidx)}}
function renderPieceAward(cidx){const c=CHAPTERS[cidx], next = cidx < CHAPTERS.length-1; shell(`
<div class="card section">
  <div class="smallTitle">메달 조각 획득!</div>
  <h1 class="heroTitle" style="font-size:2.2rem">${esc(c.piece)} 조각을 얻었습니다!</h1>
  <p class="lead">${esc(c.pieceDesc)}</p>
  ${medalWidget()}
  <div class="actions">${next?`<button class="primary" onclick="renderChapter(${cidx+1})">다음 장으로 이동</button>`:`<button class="primary" onclick="renderFinal()">역사 메달 완성 보기</button>`}</div>
</div>`)}
function scoreSummary(){const total=STATE.answers.length; const initialCorrect=STATE.answers.filter(r=>r.firstChoice!==null && r.firstChoice===r.options.indexOf(r.answer)).length; const initialRate= total? Math.round(initialCorrect/total*100):0; return {total, initialCorrect, initialRate}}
function answerReview(){return STATE.answers.map((r,idx)=>{const first = r.firstChoice===null ? '미응답' : esc(r.options[r.firstChoice]); const correct = r.firstChoice===r.options.indexOf(r.answer); return `<div class="reviewItem"><h4>${idx+1}. ${esc(r.question)}</h4><div><b>정답:</b> ${esc(r.answer)}</div><div><b>처음 선택:</b> <span class="${correct?'statusGood':'statusBad'}">${first}</span></div><div><b>재도전 횟수:</b> ${r.retries}</div><div class="muted" style="margin-top:8px">${esc(r.why)}</div></div>`}).join('')}
function buildRecord(){const s=scoreSummary(); return {studentId:STATE.studentId, studentName:STATE.studentName, medalPieces:STATE.medal, completedPieces:STATE.medal.filter(Boolean).length, initialCorrect:s.initialCorrect, totalQuestions:s.total, initialRate:s.initialRate, answers:STATE.answers, activityType:'medieval_transition_v1', completed:true, studentCode:STATE.studentId, submittedAt:new Date().toISOString()}}
function renderFinal(){STATE.completed=true; const s=scoreSummary(); shell(`
<div class="topBar"><div class="smallTitle">학습 완료</div><div class="progressPill">역사 메달 4 / 4 완성</div></div>
<div class="card section">
  <h1 class="heroTitle" style="font-size:2.3rem">🏅 역사 메달 완성! · 중세는 이제 안녕!</h1>
  <p class="lead"><b>${esc(STATE.studentName)}</b> (${esc(STATE.studentId)}) 학생이 네 개의 메달 조각을 모두 모았습니다. 이제 결과를 확인하고 제출하거나 백업 저장하세요.</p>
  ${medalWidget()}
  <div class="notice" style="margin-top:18px"><b>최초 정답률</b> : ${s.initialRate}% (${s.initialCorrect} / ${s.total})</div>
  <div class="reviewBlock">${answerReview()}</div>
  <div class="card section" style="margin-top:18px;background:#fbfdff">
    <h3 style="margin-top:0;color:var(--ink)">결과 제출</h3>
    <p class="muted">정답률은 <b>처음 선택한 답</b>을 기준으로 계산합니다. 다시 도전해서 맞힌 경우도 처음 선택 기록은 그대로 남습니다.</p>
    <div id="sendMessage" class="muted"></div>
    <div class="footerBtns"><button class="primary" id="sendBtn" onclick="submitResult()">온라인 제출 시도하기</button><button class="secondary" onclick="downloadJSON()">내 결과 백업 저장</button><button class="secondary" onclick="window.print()">PDF로 저장/인쇄</button></div>
    <p class="muted">기존 신항로 제출과 동일한 주소를 사용합니다. 교사용 수신 코드를 새 버전으로 배포해야 이 단원 결과가 올바르게 저장됩니다. 제출 확인에 실패하면 백업 파일을 저장하세요.</p>
  </div>
</div>`)}
let submitReceiptId = '';
let submitting = false;
function submissionPackage(){
 const data=buildRecord();
 if(!submitReceiptId){
  if(window.crypto && crypto.randomUUID){submitReceiptId='s'+crypto.randomUUID().replace(/-/g,'');}
  else if(window.crypto && crypto.getRandomValues){const b=new Uint8Array(24);crypto.getRandomValues(b);submitReceiptId='s'+Array.from(b,v=>v.toString(16).padStart(2,'0')).join('');}
  else {submitReceiptId='s'+Array.from({length:40},()=>Math.floor(Math.random()*16).toString(16)).join('');}
 }
 return {submissionId:submitReceiptId,result:data};
}
function receiptCheck(id,serial){
 return new Promise(resolve=>{
  const cb='medievalReceipt'+serial;const script=document.createElement('script');let done=false;
  const cleanup=()=>{if(done)return;done=true;script.remove();try{delete window[cb]}catch(_){window[cb]=undefined}clearTimeout(timer)};
  window[cb]=r=>{cleanup();resolve(!!(r && r.id===id && r.received===true))};
  script.onerror=()=>{cleanup();resolve(false)};
  script.src=SUBMIT_URL+'?action=status&id='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
  const timer=setTimeout(()=>{cleanup();resolve(false)},5000);
  document.head.appendChild(script);
 });
}
async function confirmReceipt(id){
 for(let i=0;i<5;i++){if(await receiptCheck(id,Math.floor(Math.random()*1000000000)))return true;
  if(i<4)await new Promise(resolve=>setTimeout(resolve,1700));}
 return false;
}
function submitViaForm(packet){
 return new Promise((resolve,reject)=>{
  const suffix=Math.random().toString(36).slice(2);
  const target='medievalHiddenSubmit_'+suffix;
  const frame=document.createElement('iframe');
  frame.name=target;frame.style.display='none';frame.setAttribute('aria-hidden','true');
  const form=document.createElement('form');
  form.method='POST';form.action=SUBMIT_URL;form.target=target;
  form.enctype='application/x-www-form-urlencoded';form.style.display='none';
  const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(packet);form.appendChild(input);
  document.body.appendChild(frame);document.body.appendChild(form);
  try{form.submit();resolve(true)}catch(e){reject(e)}
  finally{setTimeout(()=>{form.remove();frame.remove()},26000)}
 });
}
async function submitResult(){
 const msg=$('#sendMessage'),btn=$('#sendBtn');
 if(submitting)return;
 if(!SUBMIT_URL){msg.innerHTML='<div class="feedback bad">제출 주소를 연결하지 못했습니다. 결과 백업 파일을 저장해 주세요.</div>';return}
 submitting=true;btn.disabled=true;
 const packet=submissionPackage();
 msg.innerHTML='<div class="feedback">제출을 요청했습니다. 구글 스프레드시트에 기록되었는지 확인 중입니다.</div>';
 try{
  await submitViaForm(packet);
  await new Promise(resolve=>setTimeout(resolve,900));
  const ok=await confirmReceipt(packet.submissionId);
  if(ok){msg.innerHTML='<div class="feedback good"><b>✓ 교사용 스프레드시트에 제출 완료!</b><div>접수번호: '+esc(packet.submissionId)+'</div></div>';btn.textContent='제출 확인됨';}
  else{msg.innerHTML='<div class="feedback bad"><b>구글 시트 접수를 확인하지 못했습니다.</b> 제출용 Apps Script가 이번 수신 코드로 배포됐는지 확인해 주세요. 백업 파일도 저장해 두세요.</div>';}
 }catch(e){msg.innerHTML='<div class="feedback bad">제출 요청을 시작하지 못했습니다. 다른 브라우저로 열거나 결과 백업 파일을 저장해 주세요.</div>';}
 finally{submitting=false;btn.disabled=false}
}

function downloadJSON(){const data=JSON.stringify(buildRecord(),null,2); const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`중세는_이제_안녕_${STATE.studentId||'학생'}_${STATE.studentName||'결과'}.json`; a.click(); URL.revokeObjectURL(a.href)}
startScreen();
</script>
</body>
</html>
